          this.persistDraftSession();
        },

        resetAllCopiesToGlobal() {
          this.fileList.forEach(f => f.copies = this.copies);
          this.updatePageCounts();
        },

        resetAllColorsToGlobal() {
          this.fileList.forEach(f => f.colorMode = this.colorMode);
          this.persistDraftSession();
        },

        createDocEntry(params) {
          const docType = params.docType || 'pdf';
          return {
            id: params.id || ('doc_' + Math.random().toString(36).substring(2, 9)),
            file: params.file || null,
            name: params.name || (params.file ? params.file.name : 'document'),
            size: params.size || (params.file ? params.file.size : 1024),
            pageCount: params.pageCount || 1,
            activePages: params.activePages || params.pageCount || 1,
            pageRange: params.pageRange || '',
            showCustomRange: false,
            copies: params.copies || this.copies || 1,
            colorMode: params.colorMode || (docType === 'photo' ? 'color' : (this.colorMode || 'monochrome')),
            status: params.status || 'pending',
            progress: params.progress || 0,
            loadedBytes: 0,
            uploadedMeta: params.uploadedMeta || null,
            errorMessage: '',
            xhr: null,
            docType,
            previewUrl: params.previewUrl || null,
            _originalFile: params._originalFile || null
          };
        },

        get isPrintingOrDone() {
          return ['DOWNLOADING', 'PRINT_SUBMITTED', 'PRINTING', 'COMPLETED'].includes(this.jobStatus) ||
                 ['DOWNLOADING', 'PRINT_SUBMITTED', 'PRINTING', 'COMPLETED'].includes(this.orderStatus);
        },

        get canMergeIDCards() {
          if (this.view !== 'upload') return false;
          const imageDocs = this.fileList.filter(f => !f.name.toLowerCase().endsWith('.pdf'));
          return imageDocs.length === 2 && imageDocs.every(f => f.status === 'done');
        },

        get isCompleted() {
          return this.jobStatus === 'COMPLETED' || this.orderStatus === 'COMPLETED';
        },

        get anyUploadFailed() {
          return this.fileList.some(f => f.status === 'error');
        },

        getFileItem(id) {
          return this.fileList.find(f => f.id === id);
        },

        recomputeOverallProgress() {
          if (!this.fileList.length) {
            this.uploadPercent = 100;
            this.isUploadingFiles = false;
            return;
          }
          let totalBytes = 0;
          let loadedBytes = 0;
          let hasUploading = false;
          let uploadingCount = 0;
          let doneCount = 0;

          for (const f of this.fileList) {
            const sz = f.size || 1024;
            totalBytes += sz;
            if (f.status === 'done') {
              doneCount++;
              loadedBytes += sz;
            } else if (f.status === 'uploading') {
              hasUploading = true;
              uploadingCount++;
              loadedBytes += Math.round(((f.progress || 0) / 100) * sz);
            } else if (f.status === 'pending') {
              hasUploading = true;
            }
          }

          this.isUploadingFiles = hasUploading;
          if (totalBytes === 0) {
            this.uploadPercent = 100;
          } else {
            this.uploadPercent = Math.min(100, Math.round((loadedBytes / totalBytes) * 100));
          }

          if (uploadingCount > 0) {
            this.uploadProgressLabel = `Uploading ${doneCount + 1} of ${this.fileList.length} documents...`;
          } else {
            this.uploadProgressLabel = 'Preparing documents...';
          }
        },

        formatBytes(bytes) {
          if (!bytes) return '0 B';
          const k = 1024;
          const sizes = ['B', 'KB', 'MB'];
          const i = Math.floor(Math.log(bytes) / Math.log(k));
          return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        },

        async countPdfPagesClientSide(file) {
          try {
            if (window.PDFLib && window.PDFLib.PDFDocument) {
              const buffer = await file.arrayBuffer();
              const doc = await window.PDFLib.PDFDocument.load(buffer, { ignoreEncryption: true });
              const pages = doc.getPageCount();
              if (pages && pages > 0) return pages;
            }
          } catch (err) {
            console.warn('Client PDFLib notice:', err);
          }

          // Ultra-fast binary stream scanner fallback
          try {
            const slice = await file.slice(0, Math.min(file.size, 1048576)).arrayBuffer();
            const text = new TextDecoder('latin1').decode(slice);
            const matches = [...text.matchAll(/\/Type\s*\/Pages[\s\S]*?\/Count\s+(\d+)/g)];
            if (matches.length > 0) {
              const counts = matches.map(m => parseInt(m[1], 10)).filter(n => !isNaN(n) && n > 0);
              if (counts.length > 0) return Math.max(...counts);
            }
            const pageObjects = (text.match(/\/Type\s*\/Page\b/g) || []).length;
            if (pageObjects > 0) return pageObjects;
          } catch (_) {}

          return 1;
        },

        // ── PDF tile handler ──
        async onPDFFilesSelected(e) {
          const files = Array.from(e.target.files || []);
          if (!files.length) return;
          this.errorMessage = '';
          for (const file of files) {
            if (this.fileList.some(x => x.name === file.name && x.size === file.size)) {
              this.errorMessage = `"${file.name}" already added (duplicate skipped).`; continue;
            }
            const id = 'doc_' + Math.random().toString(36).substring(2, 9);
            // 100% accurate client-side page detection (zero server CPU/bandwidth)
            let pageCount = 1;
            try {
              pageCount = await this.countPdfPagesClientSide(file);
            } catch (_) {}

            this.fileList.push(this.createDocEntry({
              id, file, name: file.name, size: file.size, pageCount,
              activePages: pageCount, docType: 'pdf'
            }));
            setTimeout(() => this.uploadSingleFile(id), 10);
          }
          this.recomputeOverallProgress(); this.updatePageCounts();
          try { e.target.value = ''; } catch (_) {}
        },

        // ── Photo tile handler (fast background upload + optional crop/view) ──
        async onPhotoFilesSelected(e) {
          const files = Array.from(e.target.files || []);
          if (!files.length) return;
          this.errorMessage = '';
          for (const file of files) {
            if (this.fileList.some(x => x.name === file.name && x.size === file.size)) {
              this.errorMessage = `"${file.name}" already added (duplicate skipped).`; continue;
            }
            const previewUrl = URL.createObjectURL(file);
            const id = 'doc_' + Math.random().toString(36).substring(2, 9);
            this.fileList.push(this.createDocEntry({
              id, file, name: file.name, size: file.size, pageCount: 1,
              docType: 'photo', previewUrl, _originalFile: file
            }));
            // Immediately start background upload without blocking the user
            setTimeout(() => this.uploadSingleFile(id), 10);
          }
          this.recomputeOverallProgress(); this.updatePageCounts();
          try { e.target.value = ''; } catch (_) {}
        },

        // ── ID Card dual-slot flow ──
        startIDCardFlow() {
          this.idCardPair = { active: true, frontFile: null, frontPreview: null, frontCropped: null,
                              backFile: null, backPreview: null, backCropped: null };
        },

        cancelIDCardFlow() {
          if (this.idCardPair.frontPreview) URL.revokeObjectURL(this.idCardPair.frontPreview);
          if (this.idCardPair.backPreview) URL.revokeObjectURL(this.idCardPair.backPreview);
          this.idCardPair = { active: false, frontFile: null, frontPreview: null, frontCropped: null,
                              backFile: null, backPreview: null, backCropped: null };
        },

        async onIDSlotSelected(e, side) {
          const file = e.target.files?.[0];
          if (!file) return;
          const prevUrl = this.idCardPair[side + 'Preview'];
          if (prevUrl) URL.revokeObjectURL(prevUrl);
          const previewUrl = URL.createObjectURL(file);
          this.idCardPair[side + 'File'] = file;
          this.idCardPair[side + 'Preview'] = previewUrl;
          this.idCardPair[side + 'Cropped'] = null;
          try { e.target.value = ''; } catch (_) {}

          // Auto-merge as soon as both Front and Back photos are chosen (no extra prompt)
          if (this.idCardPair.frontFile && this.idCardPair.backFile) {
            await this.commitIDCardMerge();
          }
        },

        clearIDSlot(side) {
          if (this.idCardPair[side + 'Preview']) URL.revokeObjectURL(this.idCardPair[side + 'Preview']);
          this.idCardPair[side + 'File'] = null;
          this.idCardPair[side + 'Preview'] = null;
          this.idCardPair[side + 'Cropped'] = null;
        },

        editMergedIDCard(doc) {
          // Re-open ID Card dual-slot with existing photos so customer can adjust/replace sides
          this.idCardPair = {
            active: true,
            frontFile: doc.idCardDetails?.frontFile || null,
            frontPreview: doc.idCardDetails?.frontPreview || null,
            frontCropped: doc.idCardDetails?.frontCropped || null,
            backFile: doc.idCardDetails?.backFile || null,
            backPreview: doc.idCardDetails?.backPreview || null,
            backCropped: doc.idCardDetails?.backCropped || null,
            editingDocId: doc.id
          };
        },

        async commitIDCardMerge() {
          this.loading = true; this.loadingText = 'Combining ID Card Front & Back to A4...';
          try {
            const getFinalBlob = async (side) => {
              const cropped = this.idCardPair[side + 'Cropped'];
              if (cropped) return cropped;
              const file = this.idCardPair[side + 'File'];
              return file;
            };
            const getImg = (blob) => new Promise((res, rej) => {
              const img = new Image(); const url = URL.createObjectURL(blob);
              img.onload = () => { URL.revokeObjectURL(url); res(img); };
              img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Image load failed')); };
              img.src = url;
            });
            const [blob1, blob2] = await Promise.all([getFinalBlob('front'), getFinalBlob('back')]);
            const [img1, img2] = await Promise.all([getImg(blob1), getImg(blob2)]);
            const canvas = document.createElement('canvas');
            canvas.width = 1654; canvas.height = 2338;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            const cardW = 1180, cardH = 740, leftX = (canvas.width - cardW) / 2;
            ctx.drawImage(img1, leftX, 260, cardW, cardH);
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2;
            ctx.strokeRect(leftX, 260, cardW, cardH);
            ctx.drawImage(img2, leftX, 1240, cardW, cardH);
            ctx.strokeRect(leftX, 1240, cardW, cardH);
            const mergedBlob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.90));
            const mergedFile = new File([mergedBlob], 'Aadhaar_ID_Card_2in1.jpg', { type: 'image/jpeg' });
            const id = 'doc_' + Math.random().toString(36).substring(2, 9);
            const previewUrl = URL.createObjectURL(mergedBlob);

            // If we were re-editing an existing merged card, remove the old one
            if (this.idCardPair.editingDocId) {
              const existingIdx = this.fileList.findIndex(x => x.id === this.idCardPair.editingDocId);
              if (existingIdx !== -1) this.removeFile(existingIdx);
            }

            const idCardEntry = this.createDocEntry({
              id,
              file: mergedFile,
              name: 'Aadhaar_ID_Card_2in1.jpg',
              size: mergedFile.size,
              pageCount: 1,
              docType: 'idcard',
              previewUrl,
              colorMode: 'monochrome'
            });
            idCardEntry.idCardDetails = {
              frontFile: this.idCardPair.frontFile,
              frontPreview: this.idCardPair.frontPreview,
              frontCropped: this.idCardPair.frontCropped,
              backFile: this.idCardPair.backFile,
              backPreview: this.idCardPair.backPreview,
              backCropped: this.idCardPair.backCropped
            };
            this.fileList.push(idCardEntry);
            this.cancelIDCardFlow();
            this.loading = false;
            setTimeout(() => this.uploadSingleFile(id), 10);
            this.recomputeOverallProgress(); this.updatePageCounts();
          } catch (err) {
            this.loading = false;
            this.errorMessage = 'Merge failed: ' + (err.message || 'unknown error');
          }
        },

        // ── Fullscreen Document Viewer ──
        openViewer(f) {
          if (!f || !f.previewUrl) return;
          this.viewerModal = {
            open: true,
            url: f.previewUrl,
            title: f.name || 'Document Preview',
            targetId: f.id,
            docType: f.docType || 'photo'
          };
        },

        closeViewer() {
          this.viewerModal.open = false;
        },

        // ── Crop Editor ──
        openCropEditor(targetId) {
          let imageUrl = null;
          if (targetId === 'idfront') imageUrl = this.idCardPair.frontPreview;
          else if (targetId === 'idback') imageUrl = this.idCardPair.backPreview;
          else { const f = this.fileList.find(x => x.id === targetId); imageUrl = f?.previewUrl; }
          if (!imageUrl) return;
          this.cropEditor = { ...this.cropEditor, open: true, targetId, imageUrl,
            rotation: 0, enhance: true, dragging: null, _canvas: null, _ctx: null, _img: null };
        },

        onCropImageLoad() {
          const img = document.getElementById('crop-source-img');
          const wrap = document.getElementById('crop-stage-wrap');
          const canvas = document.getElementById('crop-canvas');
          if (!img || !canvas || !wrap) return;
          canvas.width = wrap.offsetWidth;
          canvas.height = wrap.offsetHeight;
          this.cropEditor._canvas = canvas;
          this.cropEditor._ctx = canvas.getContext('2d');
          this.cropEditor._img = img;
          this.cropEditor.canvasW = canvas.width;
          this.cropEditor.canvasH = canvas.height;
          this.cropEditor.imgNatW = img.naturalWidth;
          this.cropEditor.imgNatH = img.naturalHeight;
          // Default crop box = full image with 5% inset
          const iw = img.offsetWidth, ih = img.offsetHeight;
          const ox = (canvas.width - iw) / 2, oy = (canvas.height - ih) / 2;
          this.cropEditor.box = { x: ox + iw * 0.03, y: oy + ih * 0.03,
                                  w: iw * 0.94, h: ih * 0.94 };
          this.redrawCropCanvas();
          this.bindCropEvents(canvas);
        },

        redrawCropCanvas() {
          const ce = this.cropEditor;
          if (!ce._ctx || !ce._img) return;
          const canvas = ce._canvas, ctx = ce._ctx;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const img = ce._img;
          const iw = img.offsetWidth, ih = img.offsetHeight;
          const ox = (canvas.width - iw) / 2, oy = (canvas.height - ih) / 2;
          // Dim overlay
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          // Clear crop region (shows image through)
          const b = ce.box;
          ctx.clearRect(b.x, b.y, b.w, b.h);
          // Crop border
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
          ctx.strokeRect(b.x, b.y, b.w, b.h);
          // Corner handles
          const hs = 12;
          ctx.fillStyle = '#3b82f6';
          [[b.x,b.y],[b.x+b.w,b.y],[b.x,b.y+b.h],[b.x+b.w,b.y+b.h]].forEach(([hx,hy]) => {
            ctx.fillRect(hx - hs/2, hy - hs/2, hs, hs);
          });
        },

        bindCropEvents(canvas) {
          const getPos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const src = e.touches ? e.touches[0] : e;
            return { x: src.clientX - rect.left, y: src.clientY - rect.top };
          };
          const hitHandle = (px, py) => {
            const b = this.cropEditor.box; const tol = 20;
            if (Math.abs(px - b.x) < tol && Math.abs(py - b.y) < tol) return 'tl';
            if (Math.abs(px - (b.x+b.w)) < tol && Math.abs(py - b.y) < tol) return 'tr';
            if (Math.abs(px - b.x) < tol && Math.abs(py - (b.y+b.h)) < tol) return 'bl';
            if (Math.abs(px - (b.x+b.w)) < tol && Math.abs(py - (b.y+b.h)) < tol) return 'br';
            if (px > b.x && px < b.x+b.w && py > b.y && py < b.y+b.h) return 'move';
            return null;
          };
          const down = (e) => {
            const { x, y } = getPos(e);
            const h = hitHandle(x, y);
            if (!h) return;
            e.preventDefault();
            const b = this.cropEditor.box;
            this.cropEditor.dragging = { handle: h, sx: x, sy: y, bx: b.x, by: b.y, bw: b.w, bh: b.h };
          };
          let rafPending = false;
          const move = (e) => {
            if (!this.cropEditor.dragging) return;
            e.preventDefault();
            const { x, y } = getPos(e);
            const d = this.cropEditor.dragging;
            const dx = x - d.sx, dy = y - d.sy;
            const b = this.cropEditor.box;
            const MIN = 30;
            if (d.handle === 'move') {
              b.x = Math.max(0, Math.min(d.bx + dx, this.cropEditor.canvasW - b.w));
              b.y = Math.max(0, Math.min(d.by + dy, this.cropEditor.canvasH - b.h));
            } else if (d.handle === 'tl') {
              const nw = Math.max(MIN, d.bw - dx), nh = Math.max(MIN, d.bh - dy);
              b.x = d.bx + d.bw - nw; b.y = d.by + d.bh - nh; b.w = nw; b.h = nh;
            } else if (d.handle === 'tr') {
              b.w = Math.max(MIN, d.bw + dx);
              const nh = Math.max(MIN, d.bh - dy); b.y = d.by + d.bh - nh; b.h = nh;
            } else if (d.handle === 'bl') {
              const nw = Math.max(MIN, d.bw - dx); b.x = d.bx + d.bw - nw; b.w = nw;
              b.h = Math.max(MIN, d.bh + dy);
            } else if (d.handle === 'br') {
              b.w = Math.max(MIN, d.bw + dx); b.h = Math.max(MIN, d.bh + dy);
            }
            if (!rafPending) {
              rafPending = true;
              requestAnimationFrame(() => {
                this.redrawCropCanvas();
                rafPending = false;
              });
            }
          };
          const up = () => { this.cropEditor.dragging = null; };
          canvas.addEventListener('mousedown', down); canvas.addEventListener('touchstart', down, { passive: false });
          canvas.addEventListener('mousemove', move); canvas.addEventListener('touchmove', move, { passive: false });
          canvas.addEventListener('mouseup', up); canvas.addEventListener('touchend', up);
        },

        rotateCrop(deg) {
          this.cropEditor.rotation = (this.cropEditor.rotation + deg + 360) % 360;
          // Apply rotation to image in a temp canvas and update source
          const src = document.getElementById('crop-source-img');
          if (!src) return;
          const c = document.createElement('canvas');
          const rad = this.cropEditor.rotation * Math.PI / 180;
          const iw = src.naturalWidth, ih = src.naturalHeight;
          const abscos = Math.abs(Math.cos(rad)), abssin = Math.abs(Math.sin(rad));
          c.width = Math.round(iw * abscos + ih * abssin);
          c.height = Math.round(iw * abssin + ih * abscos);
          const cx2 = c.getContext('2d');
          cx2.translate(c.width/2, c.height/2);
          cx2.rotate(rad);
          cx2.drawImage(src, -iw/2, -ih/2);
          c.toBlob(blob => {
            if (!blob) return;
            const newUrl = URL.createObjectURL(blob);
            const old = this.cropEditor.imageUrl;
            this.cropEditor.imageUrl = newUrl;
            // Don't revoke old if it's the original preview — track separately
          }, 'image/jpeg', 0.92);
        },

        resetCropBox() {
          const img = document.getElementById('crop-source-img');
          const wrap = document.getElementById('crop-stage-wrap');
          if (!img || !wrap) return;
          const iw = img.offsetWidth, ih = img.offsetHeight;
          const ox = (wrap.offsetWidth - iw) / 2, oy = (wrap.offsetHeight - ih) / 2;
          this.cropEditor.box = { x: ox + iw * 0.03, y: oy + ih * 0.03, w: iw * 0.94, h: ih * 0.94 };
          this.redrawCropCanvas();
        },

        closeCropEditor(useOriginal) {
          const ce = this.cropEditor;
          if (useOriginal) {
            // Skip crop — just upload the original
            if (ce.targetId && ce.targetId !== 'idfront' && ce.targetId !== 'idback') {
              const f = this.fileList.find(x => x.id === ce.targetId);
              if (f && f.status === 'pending') setTimeout(() => this.uploadSingleFile(f.id), 10);
            }
          }
          ce.open = false;
        },

        async applyCropAndClose() {
          const ce = this.cropEditor;
          const img = document.getElementById('crop-source-img');
          if (!img) { this.closeCropEditor(true); return; }

          const srcCanvas = document.createElement('canvas');
          const iw = img.naturalWidth, ih = img.naturalHeight;
          srcCanvas.width = iw; srcCanvas.height = ih;
          const sctx = srcCanvas.getContext('2d');
          sctx.drawImage(img, 0, 0, iw, ih);

          // Map canvas-displayed crop box → natural image coordinates
          const dispW = img.offsetWidth, dispH = img.offsetHeight;
          const wrap = document.getElementById('crop-stage-wrap');
          const wrapW = wrap?.offsetWidth || dispW;
          const ox = (wrapW - dispW) / 2;
          const oy = (wrap?.offsetHeight - dispH) / 2 || 0;
          const scaleX = iw / dispW, scaleY = ih / dispH;
          const b = ce.box;
          const cx = Math.round((b.x - ox) * scaleX);
          const cy = Math.round((b.y - oy) * scaleY);
          const cw = Math.round(b.w * scaleX);
          const ch = Math.round(b.h * scaleY);
          const safeCx = Math.max(0, Math.min(cx, iw - 1));
          const safeCy = Math.max(0, Math.min(cy, ih - 1));
          const safeCw = Math.max(10, Math.min(cw, iw - safeCx));
          const safeCh = Math.max(10, Math.min(ch, ih - safeCy));

          const maxDim = 2400;
          let outW = safeCw, outH = safeCh;
          if (outW > maxDim || outH > maxDim) {
            const ratio = Math.min(maxDim / outW, maxDim / outH);
            outW = Math.round(outW * ratio);
            outH = Math.round(outH * ratio);
          }

          const out = document.createElement('canvas');
          out.width = outW; out.height = outH;
          const octx = out.getContext('2d');
          octx.drawImage(srcCanvas, safeCx, safeCy, safeCw, safeCh, 0, 0, outW, outH);

          if (ce.enhance) {
            // Ultra-fast integer contrast boost — no detail loss, zero lag
            const imgData = octx.getImageData(0, 0, outW, outH);
            const d = imgData.data;
            const len = d.length;
            for (let i = 0; i < len; i += 4) {
              const r = ((d[i] - 128) * 118 >> 7) + 134;
              const g = ((d[i+1] - 128) * 118 >> 7) + 134;
              const b = ((d[i+2] - 128) * 118 >> 7) + 134;
              d[i]   = r > 255 ? 255 : (r < 0 ? 0 : r);
              d[i+1] = g > 255 ? 255 : (g < 0 ? 0 : g);
              d[i+2] = b > 255 ? 255 : (b < 0 ? 0 : b);
            }
            octx.putImageData(imgData, 0, 0);
          }

          const croppedBlob = await new Promise(r => out.toBlob(r, 'image/jpeg', 0.92));

          if (ce.targetId === 'idfront') {
            this.idCardPair.frontCropped = croppedBlob;
            const newUrl = URL.createObjectURL(croppedBlob);
            if (this.idCardPair.frontPreview) URL.revokeObjectURL(this.idCardPair.frontPreview);
            this.idCardPair.frontPreview = newUrl;
            if (this.idCardPair.backFile) {
              await this.commitIDCardMerge();
            }
          } else if (ce.targetId === 'idback') {
            this.idCardPair.backCropped = croppedBlob;
            const newUrl = URL.createObjectURL(croppedBlob);
            if (this.idCardPair.backPreview) URL.revokeObjectURL(this.idCardPair.backPreview);
            this.idCardPair.backPreview = newUrl;
            if (this.idCardPair.frontFile) {
              await this.commitIDCardMerge();
            }
          } else {
            const f = this.fileList.find(x => x.id === ce.targetId);
            if (f) {
              const croppedFile = new File([croppedBlob], f.name, { type: 'image/jpeg' });
              f.file = croppedFile; f.size = croppedFile.size;
              const newUrl = URL.createObjectURL(croppedBlob);
              if (f.previewUrl) URL.revokeObjectURL(f.previewUrl);
              f.previewUrl = newUrl;
              // If previously pending, upload; if already uploaded, re-upload cropped version
              setTimeout(() => this.uploadSingleFile(f.id), 10);
            }
          }
          ce.open = false;
        },

        async onFilesSelected(e) {
          const files = Array.from(e.target.files || []);
          if (!files.length) return;
          this.errorMessage = '';

          // ── Foolproof Guard 1: Duplicate Selection Protection ──
          for (const file of files) {
            const isDuplicate = this.fileList.some(
              existing => existing.name === file.name && existing.size === file.size
            );
            if (isDuplicate) {
              this.errorMessage = `"${file.name}" was already added (duplicate skipped).`;
              continue;
            }

            const id = 'doc_' + Math.random().toString(36).substring(2, 9);
            const isPdf = file.name.toLowerCase().endsWith('.pdf') || file.type === 'application/pdf';
            const previewUrl = (!isPdf && file.type.startsWith('image/')) ? URL.createObjectURL(file) : null;
            const docType = isPdf ? 'pdf' : 'photo';

            this.fileList.push({
              id,
              file,
              name: file.name,
              size: file.size,
              pageCount: 1,
              status: 'pending',
              progress: 0,
              loadedBytes: 0,
              uploadedMeta: null,
              errorMessage: '',
              xhr: null,
              docType,
              previewUrl
            });
            // Launch background upload
            setTimeout(() => this.uploadSingleFile(id), 10);
          }
          this.recomputeOverallProgress();
          this.updatePageCounts();
          try { e.target.value = ''; } catch (_) {}
        },

        async onIDCardFilesSelected(e) {
          const files = Array.from(e.target.files || []);
          if (!files.length) return;
          this.errorMessage = '';

          // If customer selects 2 images directly (Front & Back), automatically merge into 1 A4 page!
          if (files.length === 2) {
            this.loading = true;
            this.loadingText = 'Auto-combining Aadhaar Front & Back into 1 A4 page...';
            try {
              const loadImage = (f) => new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(f);
                img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image decode error')); };
                img.src = url;
              });

              const [img1, img2] = await Promise.all([loadImage(files[0]), loadImage(files[1])]);

              // 200 DPI standard A4 sheet
              const canvas = document.createElement('canvas');
              canvas.width = 1654;
              canvas.height = 2338;
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, canvas.width, canvas.height);

              const cardWidth = 1180;
              const cardHeight = 750;
              const leftX = (canvas.width - cardWidth) / 2;

              // Front (Top)
              ctx.drawImage(img1, leftX, 280, cardWidth, cardHeight);
              ctx.strokeStyle = '#e2e8f0';
              ctx.lineWidth = 2;
              ctx.strokeRect(leftX, 280, cardWidth, cardHeight);

              // Back (Bottom)
              ctx.drawImage(img2, leftX, 1260, cardWidth, cardHeight);
              ctx.strokeStyle = '#e2e8f0';
              ctx.lineWidth = 2;
              ctx.strokeRect(leftX, 1260, cardWidth, cardHeight);

              const mergedBlob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.88));
              const mergedFile = new File([mergedBlob], 'ID_Card_Front_Back_Merged.jpg', { type: 'image/jpeg' });

              const id = 'doc_' + Math.random().toString(36).substring(2, 9);
              this.fileList.push({
                id,
                file: mergedFile,
                name: mergedFile.name,
                size: mergedFile.size,
                pageCount: 1,
                status: 'pending',
                progress: 0,
                loadedBytes: 0,
                uploadedMeta: null,
                errorMessage: '',
                xhr: null,
                docType: 'idcard',
                previewUrl: URL.createObjectURL(mergedBlob)
              });
              this.loading = false;
              setTimeout(() => this.uploadSingleFile(id), 10);
              this.recomputeOverallProgress();
              this.updatePageCounts();
              try { e.target.value = ''; } catch (_) {}
              return;
            } catch (err) {
              console.warn('ID Card auto-merge fallback to standard files:', err);
              this.loading = false;
            }
          }

          // Fallback if 1 or more than 2 files selected: add normally
          for (const file of files) {
            const id = 'doc_' + Math.random().toString(36).substring(2, 9);
            const isPdf = file.name.toLowerCase().endsWith('.pdf') || file.type === 'application/pdf';
            this.fileList.push({
              id,
              file,
              name: file.name,
              size: file.size,
              pageCount: 1,
              status: 'pending',
              progress: 0,
              loadedBytes: 0,
              uploadedMeta: null,
              errorMessage: '',
              xhr: null,
              docType: isPdf ? 'pdf' : 'photo',
              previewUrl: (!isPdf && file.type.startsWith('image/')) ? URL.createObjectURL(file) : null
            });
            setTimeout(() => this.uploadSingleFile(id), 10);
          }
          this.recomputeOverallProgress();
          this.updatePageCounts();
          try { e.target.value = ''; } catch (_) {}
        },

        uploadSingleFile(id) {
          const item = this.getFileItem(id);
          if (!item || item.status === 'done') return;
          item.status = 'uploading';
          item.progress = 0;
          item.errorMessage = '';
          this.recomputeOverallProgress();

          // ── Step 1: Lightweight Client-side Image Optimization (EXIF + Contrast + Unsharp Mask) ──
          // Corrects sideways/upside-down photos, sharpens blurry text/ID cards, and compresses.
          const isImage = item.file.type.startsWith('image/');
          const compress = (file) => new Promise((resolve) => {
            if (!isImage) { resolve(file); return; }
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
              URL.revokeObjectURL(url);
              const MAX = 1800;
              let { width: w, height: h } = img;
              if (w > MAX || h > MAX) {
                const ratio = Math.min(MAX / w, MAX / h);
                w = Math.round(w * ratio);
                h = Math.round(h * ratio);
              }
              const canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);

              // High-speed Document Enhancement Filter (Adaptive Contrast + Sharpness for text clarity)
              try {
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                // Contrast stretch + mid-tone boost to make blurry camera photos laser-crisp
                const contrastFactor = 1.18; // +18% contrast
                const brightnessOffset = 8;  // mild white-point lift
                let colorSamples = 0;
                let totalSamples = 0;
                for (let i = 0; i < data.length; i += 4) {
                  // Sample color saturation (skip background white/black)
                  if (i % 16 === 0) {
                    const r = data[i], g = data[i + 1], b = data[i + 2];
                    if (Math.abs(r - g) > 22 || Math.abs(r - b) > 22 || Math.abs(g - b) > 22) {
                      colorSamples++;
                    }
                    totalSamples++;
                  }
                  data[i]     = Math.min(255, Math.max(0, (data[i] - 128) * contrastFactor + 128 + brightnessOffset));
                  data[i + 1] = Math.min(255, Math.max(0, (data[i + 1] - 128) * contrastFactor + 128 + brightnessOffset));
                  data[i + 2] = Math.min(255, Math.max(0, (data[i + 2] - 128) * contrastFactor + 128 + brightnessOffset));
                }
                ctx.putImageData(imgData, 0, 0);

                if (totalSamples > 40 && (colorSamples / totalSamples) < 0.025) {
                  this.detectedGrayscaleDoc = true;
                }
              } catch (_) {}

              canvas.toBlob(
                (blob) => resolve(blob ? new File([blob], file.name.replace(/\.[^/.]+$/, '.jpg'), { type: 'image/jpeg' }) : file),
                'image/jpeg', 0.82
              );
            };
            img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
            img.src = url;
          });

          // ── Step 3: Presigned direct-to-cloud upload ────────────────────────
          // Asks server for a one-time upload URL, then sends the file straight
          // ── Direct Cloud Upload with Anti-Stall Watchdog & Automatic Retry ──
          // Sends the file straight to Cloud Storage (Backblaze B2 / Cloudflare R2).
          // Server bandwidth consumed: 0 bytes!
          const doPresignedUpload = async (file, maxRetries = 3) => {
            let lastErr = null;
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
              try {
                // 1. Get presigned upload URL from server (tiny metadata, <1 KB)
                const metaRes = await fetch('/api/uploads/presigned-url', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    shopSlug: this.shopSlug,
                    filename: file.name,
                    mimeType: file.type || 'application/octet-stream',
                    fileSize: file.size
                  })
                });
                if (!metaRes.ok) {
                  const e = await metaRes.json().catch(() => ({}));
                  throw new Error(e.error || 'Could not get upload URL');
                }
                const resJson = await metaRes.json();
                const uploadUrl = resJson.uploadUrl;
                const fileKey = resJson.fileKey || resJson.key;

                // 2. Stream file directly to Cloud Storage with Anti-Stall Guard
                await new Promise((resolve, reject) => {
                  const xhr = new XMLHttpRequest();
                  const live = this.getFileItem(id);
                  let lastBytes = 0;
                  let lastProgressTime = Date.now();

                  // Anti-Stall Watchdog: If upload stalls for > 8s on mobile, abort and auto-retry
                  const stallTimer = setInterval(() => {
                    if (Date.now() - lastProgressTime > 8000 && lastBytes < file.size) {
                      clearInterval(stallTimer);
                      xhr.abort();
                      reject(new Error('Connection stalled on mobile network (retrying)'));
                    }
                  }, 2000);

                  xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable && live) {
                      live.loadedBytes = e.loaded;
                      live.progress = Math.min(99, Math.round((e.loaded / e.total) * 100));
                      this.recomputeOverallProgress();
                      if (e.loaded > lastBytes) {
                        lastBytes = e.loaded;
                        lastProgressTime = Date.now();
                      }
                    }
                  };
                  xhr.onload = () => {
                    clearInterval(stallTimer);
                    if (xhr.status >= 200 && xhr.status < 400) {
                      resolve();
                    } else {
                      reject(new Error(`Cloud upload status ${xhr.status}`));
                    }
                  };
                  xhr.onerror = () => { clearInterval(stallTimer); reject(new Error('Cloud network error')); };
                  xhr.ontimeout = () => { clearInterval(stallTimer); reject(new Error('Cloud upload timeout')); };

                  xhr.open('PUT', uploadUrl);
                  if (file.type) {
                    xhr.setRequestHeader('Content-Type', file.type);
                  }
                  xhr.timeout = 180000; // 3 min — large PDFs on slow Indian mobile need time
                  xhr.send(file);
                });

                return { fileKey };
              } catch (err) {
                lastErr = err;
                console.warn(`[upload] Cloud attempt ${attempt} notice:`, err.message);
                if (attempt < maxRetries) {
                  await new Promise(r => setTimeout(r, 600));
                }
              }
            }
            throw lastErr || new Error('Cloud upload failed after retries');
          };

          // ── Fast Direct Upload: Direct stream to server (local SSD cache + async B2 sync) ──
          const doDirectUpload = (file) => new Promise((resolve, reject) => {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('shopSlug', this.shopSlug);
            const xhr = new XMLHttpRequest();
            xhr.upload.onprogress = (e) => {
              if (e.lengthComputable) {
                const live = this.getFileItem(id);
                if (live) {
                  live.loadedBytes = e.loaded;
                  live.progress = Math.min(97, Math.round((e.loaded / e.total) * 100));
                  this.recomputeOverallProgress();
                }
              }
            };
            xhr.onload = () => {
              if (xhr.status >= 200 && xhr.status < 300) {
                try { resolve(JSON.parse(xhr.responseText)); }
                catch { reject(new Error('Upload parse error')); }
              } else {
                let msg = 'Upload failed';
                try { msg = JSON.parse(xhr.responseText).error || msg; } catch (_) {}
                reject(new Error(msg));
              }
            };
            xhr.onerror   = () => reject(new Error('Network connection failed'));
            xhr.ontimeout = () => reject(new Error('Upload timed out'));
            xhr.open('POST', `/api/uploads/direct?shopSlug=${encodeURIComponent(this.shopSlug)}`);
            xhr.timeout = 180_000; // 3 min for large PDFs on fallback path
            xhr.send(formData);
          });

          // ── Orchestrate: Direct-to-Cloud first (0 server bandwidth) with smart fallback ──
          (async () => {
            const live = this.getFileItem(id);
            if (!live) return;
            try {
              const compressed = await compress(item.file);
              const accuratePageCount = item.pageCount || 1;

              let fileKey;
              try {
                // Priority 1: Zero Server Bandwidth - Direct to Cloud Storage with Anti-Stall Watchdog
                const res = await doPresignedUpload(compressed);
                fileKey = res.fileKey;
              } catch (cloudErr) {
                // Fallback: If cloud direct upload is blocked on client network, stream via server
                console.warn('[upload] Cloud direct upload exhausted, using direct server fallback:', cloudErr.message);
                const res = await doDirectUpload(compressed);
                fileKey = res.fileKey;
              }

              const l2 = this.getFileItem(id);
              if (!l2) return;
              l2.status   = 'done';
              l2.progress = 100;
              l2.uploadedMeta = {
                fileKey,
                originalFilename: item.file.name,
                fileSize: compressed.size,
                mimeType: compressed.type || item.file.type,
                pageCount: accuratePageCount
              };
              l2.pageCount = accuratePageCount;
              this.updatePageCounts();
              this.persistDraftSession();
            } catch (err) {
              const l2 = this.getFileItem(id);
              if (l2) { l2.status = 'error'; l2.errorMessage = err.message || 'Upload failed'; }
            }
            this.recomputeOverallProgress();
          })();
        },

        retryUpload(id) {
          this.errorMessage = '';
          this.uploadSingleFile(id);
        },

        removeFile(index) {
          const item = this.fileList[index];
          if (item) {
            if (item.xhr && item.status === 'uploading') {
              try { item.xhr.abort(); } catch (_) {}
            }
            if (item.previewUrl) {
              try { URL.revokeObjectURL(item.previewUrl); } catch (_) {}
            }
          }
          this.fileList.splice(index, 1);
          this.recomputeOverallProgress();
          this.updatePageCounts();
          this.persistDraftSession();
        },

        updatePageCounts() {
          let sum = 0;
          this.fileList.forEach(f => sum += f.pageCount);
          this.totalRawPages = Math.max(1, sum);
          this.recalculateCustomPages();
        },

        recalculateCustomPages() {
          if (!this.showRangeInput || !this.customPageRange.trim()) {
            this.activePrintPages = this.totalRawPages;
            return;
          }
          // ── Foolproof Guard 2: Auto-Correct Invalid/Reversed Page Ranges ──
          let count = 0;
          const parts = this.customPageRange.split(',');
          for (const p of parts) {
            const trimmed = p.trim();
            if (!trimmed) continue;
            if (trimmed.includes('-')) {
              let [start, end] = trimmed.split('-').map(Number);
              if (!isNaN(start) && !isNaN(end)) {
                // Auto-correct reversed range e.g. "5-2" -> "2-5"
                if (start > end) { const temp = start; start = end; end = temp; }
                // Clamp within bounds (1 to totalRawPages)
                start = Math.max(1, Math.min(start, this.totalRawPages));
                end = Math.max(1, Math.min(end, this.totalRawPages));
                if (end >= start) count += (end - start + 1);
              }
            } else if (!isNaN(Number(trimmed))) {
              const pageNum = Number(trimmed);
              if (pageNum >= 1 && pageNum <= this.totalRawPages) {
                count += 1;
              }
            }
          }
          this.activePrintPages = Math.max(1, count || this.totalRawPages);
        },

        // ── Session Persistence: Cache upload metadata so refresh doesn't lose documents ──
        persistDraftSession() {
          try {
            const completedFiles = this.fileList
              .filter(f => f.status === 'done' && f.uploadedMeta)
              .map(f => ({
                id: f.id,
                name: f.name,
                size: f.size,
                pageCount: f.pageCount,
                uploadedMeta: f.uploadedMeta
              }));

            const draft = {
              timestamp: Date.now(),
              shopSlug: this.shopSlug,
              files: completedFiles,
              customerName: this.customerName,
              colorMode: this.colorMode,
              duplexMode: this.duplexMode,
              pagesPerSheet: this.pagesPerSheet,
              copies: this.copies,
              stampPaperMode: this.stampPaperMode
            };
            localStorage.setItem(`qrd_draft_${this.shopSlug}`, JSON.stringify(draft));
          } catch (_) {}
        },

        restoreDraftSession() {
          try {
            const raw = localStorage.getItem(`qrd_draft_${this.shopSlug}`);
            if (!raw) return;
            const draft = JSON.parse(raw);
            // Session expires after 2 hours
            if (Date.now() - draft.timestamp > 2 * 60 * 60 * 1000) {
              localStorage.removeItem(`qrd_draft_${this.shopSlug}`);
              return;
            }
            if (Array.isArray(draft.files) && draft.files.length > 0) {
              this.fileList = draft.files.map(f => ({
                id: f.id,
                file: { name: f.name, size: f.size, type: f.uploadedMeta?.mimeType || 'application/octet-stream' },
                name: f.name,
                size: f.size,
                pageCount: f.pageCount || 1,
                status: 'done',
                progress: 100,
                loadedBytes: f.size,
                uploadedMeta: f.uploadedMeta,
                errorMessage: '',
                xhr: null
              }));
              if (draft.customerName) this.customerName = draft.customerName;
              if (draft.colorMode) this.colorMode = draft.colorMode;
              if (draft.duplexMode) this.duplexMode = draft.duplexMode;
              if (draft.pagesPerSheet) this.pagesPerSheet = draft.pagesPerSheet;
              if (draft.copies) this.copies = draft.copies;
              if (draft.stampPaperMode !== undefined) this.stampPaperMode = draft.stampPaperMode;
              this.restoredSession = true;
              this.recomputeOverallProgress();
              this.updatePageCounts();
            }
          } catch (_) {}
        },

        clearDraftSession() {
          try {
            localStorage.removeItem(`qrd_draft_${this.shopSlug}`);
          } catch (_) {}
          this.restoredSession = false;
          this.resetToUpload();
        },

        // ── Smart 1-Click Aadhaar / Dual ID Card Merger ──
        // Stacks 2 images (Front & Back) on one crisp, high-res A4 canvas
        async mergeIDCardImages() {
          const imageDocs = this.fileList.filter(f => !f.name.toLowerCase().endsWith('.pdf'));
          if (imageDocs.length !== 2) return;
          this.loading = true;
          this.loadingText = 'Merging ID Card Front & Back onto 1 A4 Page...';

          try {
            // Load image element from URL
            const loadImage = (url) => new Promise((resolve, reject) => {
              const img = new Image();
              img.crossOrigin = 'anonymous';
              img.onload = () => resolve(img);
              img.onerror = reject;
              img.src = url;
            });

            const fetchBlobUrl = async (item) => {
              if (item.file instanceof Blob && item.file.size > 0) {
                return URL.createObjectURL(item.file);
              }
              const res = await fetch(`/api/uploads/${item.uploadedMeta.fileKey}`);
              const blob = await res.blob();
              return URL.createObjectURL(blob);
            };

            const url1 = await fetchBlobUrl(imageDocs[0]);
            const url2 = await fetchBlobUrl(imageDocs[1]);
            const [img1, img2] = await Promise.all([loadImage(url1), loadImage(url2)]);
            URL.revokeObjectURL(url1);
            URL.revokeObjectURL(url2);

            // A4 Canvas (1654 x 2338)
            const canvas = document.createElement('canvas');
            canvas.width = 1654;
            canvas.height = 2338;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cardWidth = 1180;
            const cardHeight = 750;
            const leftX = (canvas.width - cardWidth) / 2;

            // Slot 1: Front (Top)
            const topY1 = 280;
            ctx.drawImage(img1, leftX, topY1, cardWidth, cardHeight);
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 2;
            ctx.strokeRect(leftX, topY1, cardWidth, cardHeight);

            // Slot 2: Back (Bottom)
            const topY2 = 1260;
            ctx.drawImage(img2, leftX, topY2, cardWidth, cardHeight);
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 2;
            ctx.strokeRect(leftX, topY2, cardWidth, cardHeight);

            const mergedBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.88));
            const mergedFile = new File([mergedBlob], 'Aadhaar_Front_Back_Merged.jpg', { type: 'image/jpeg' });

            this.fileList = [];
            const id = 'doc_' + Math.random().toString(36).substring(2, 9);
            this.fileList.push({
              id,
              file: mergedFile,
              name: mergedFile.name,
              size: mergedFile.size,
              pageCount: 1,
              status: 'pending',
              progress: 0,
              loadedBytes: 0,
              uploadedMeta: null,
              errorMessage: '',
              xhr: null
            });

            this.loading = false;
            this.uploadSingleFile(id);
            this.recomputeOverallProgress();
            this.updatePageCounts();
          } catch (err) {
            console.error('Merge error:', err);
            this.errorMessage = 'Could not merge ID cards: ' + (err.message || 'unknown error');
            this.loading = false;
          }
        },

        async waitForAllUploads() {
          return new Promise((resolve) => {
            const interval = setInterval(() => {
              const anyError = this.fileList.some(f => f.status === 'error');
              if (anyError) {
                clearInterval(interval);
                return resolve(false);
              }
              const allDone = this.fileList.every(f => f.status === 'done');
              if (allDone) {
                clearInterval(interval);
                return resolve(true);
              }
            }, 100);
          });
        },

        async startPayAtCounter() {
          if (!this.fileList.length) return;
          this.loading = true;
          this.loadingText = 'Finishing Upload...';
          this.errorMessage = '';

          const pending = this.fileList.filter(f => f.status !== 'done');
          if (pending.length > 0) {
            pending.forEach(f => { if (f.status === 'pending') this.uploadSingleFile(f.id); });
            const ok = await this.waitForAllUploads();
            if (!ok) {
              this.loading = false;
              this.errorMessage = 'Upload failed. Tap Retry.';
              return;
            }
          }

          try {
            this.loadingText = 'Submitting Order...';
            const uploadedFiles = this.fileList
              .filter(item => item && item.uploadedMeta && item.uploadedMeta.fileKey)
              .map(item => ({
                fileKey: item.uploadedMeta.fileKey,
                originalFilename: item.uploadedMeta.originalFilename || item.name || 'document',
                fileSize: item.uploadedMeta.fileSize || item.size || 1024,
                mimeType: item.uploadedMeta.mimeType || 'application/octet-stream',
                pageCount: item.activePages || item.uploadedMeta.pageCount || item.pageCount || 1,
                pageRange: item.pageRange || (this.showRangeInput ? this.customPageRange : undefined),
                copies: item.copies || this.copies || 1,
                colorMode: (item.colorMode && item.colorMode !== 'default') ? item.colorMode : this.colorMode
              }));

            if (!uploadedFiles.length) {
              this.loading = false;
              this.errorMessage = 'Please wait for documents to finish uploading before continuing.';
              return;
            }

            const orderPayload = {
              shopSlug: this.shopSlug,
              customerName: this.customerName ? this.customerName.trim() : undefined,
              payAtCounter: true,
              files: uploadedFiles,
              printOptions: {
                copies: this.copies,
                colorMode: this.colorMode,
                duplexMode: this.duplexMode,
                paperSize: 'A4',
                orientation: 'portrait',
                pagesPerSheet: this.pagesPerSheet || 1,
                pageRange: this.showRangeInput ? this.customPageRange : undefined,
                stampPaperMode: this.stampPaperMode
              }
            };

            const orderRes = await fetch('/api/orders', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(orderPayload)
            });

            if (!orderRes.ok) {
              const errData = await orderRes.json();
              throw new Error(errData.error || 'Failed to submit order');
            }

            const orderData = await orderRes.json();
            this.orderId = orderData.orderId;
            this.orderCode = '#' + orderData.orderId.slice(-4).toUpperCase();
            this.isPayAtCounterOrder = true;
            this.orderStatus = 'PAY_AT_COUNTER_PENDING';
            this.clearDraftSession();
            this.view = 'tracking';
            this.loading = false;
            this.startPolling();
          } catch (err) {
            this.errorMessage = err.message || 'Submission error';
            this.loading = false;
          }
        },

        async startPayAndPrint() {
          if (!this.fileList.length) return;
          if (this.shopInfo.requireCustomerName && (!this.customerName || !this.customerName.trim())) {
            this.errorMessage = 'Please enter your name for pickup identification.';
            return;
          }

          // Check for failed uploads
          const failed = this.fileList.filter(f => f.status === 'error');
          if (failed.length > 0) {
            this.errorMessage = 'One or more documents failed to upload. Please tap "Retry" on the failed item.';
            return;
          }

          this.loading = true;
          this.errorMessage = '';

          // Wait for any in-flight uploads to complete
          const pending = this.fileList.filter(f => f.status !== 'done');
          if (pending.length > 0) {
            this.loadingText = 'Finishing Upload...';
            pending.forEach(f => { if (f.status === 'pending') this.uploadSingleFile(f.id); });

            const ok = await this.waitForAllUploads();
            if (!ok) {
              this.loading = false;
              this.errorMessage = 'Document upload encountered an error. Please retry.';
              return;
            }
          }

          try {
            this.loadingText = 'Opening Payment...';
            const uploadedFiles = this.fileList
              .filter(item => item && item.uploadedMeta && item.uploadedMeta.fileKey)
              .map(item => ({
                fileKey: item.uploadedMeta.fileKey,
                originalFilename: item.uploadedMeta.originalFilename || item.name || 'document',
                fileSize: item.uploadedMeta.fileSize || item.size || 1024,
                mimeType: item.uploadedMeta.mimeType || 'application/octet-stream',
                pageCount: item.activePages || item.uploadedMeta.pageCount || item.pageCount || 1,
                pageRange: item.pageRange || (this.showRangeInput ? this.customPageRange : undefined),
                copies: item.copies || this.copies || 1,
                colorMode: (item.colorMode && item.colorMode !== 'default') ? item.colorMode : this.colorMode
              }));

            if (!uploadedFiles.length) {
              this.loading = false;
              this.errorMessage = 'Please wait for documents to finish uploading before continuing.';
              return;
            }

            const orderPayload = {
              shopSlug: this.shopSlug,
              customerName: this.customerName ? this.customerName.trim() : undefined,
              files: uploadedFiles,
              printOptions: {
                copies: this.copies,
                colorMode: this.colorMode,
                duplexMode: this.duplexMode,
                paperSize: 'A4',
                orientation: 'portrait',
                pagesPerSheet: this.pagesPerSheet || 1,
                pageRange: this.showRangeInput ? this.customPageRange : undefined,
                stampPaperMode: this.stampPaperMode
              }
            };

            const orderRes = await fetch('/api/orders', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(orderPayload)
            });

            if (!orderRes.ok) {
              const errData = await orderRes.json();
              throw new Error(errData.error || 'Failed to create order');
            }

            const orderData = await orderRes.json();
            this.orderId = orderData.orderId;
            this.orderCode = '#' + orderData.orderId.slice(-4).toUpperCase();

            if (!this.cashfreeInstance && window.Cashfree) {
              this.cashfreeInstance = window.Cashfree({ mode: this.shopInfo.sandbox ? 'sandbox' : 'production' });
            }

            if (this.cashfreeInstance && orderData.paymentSessionId) {
              this.cashfreeInstance.checkout({
                paymentSessionId: orderData.paymentSessionId,
                redirectTarget: '_modal'
              }).then(async (result) => {
                if (result.error) {
                  this.errorMessage = result.error.message || 'Payment was cancelled. You can retry anytime.';
                  this.loading = false;
                  return;
                }
                // Payment completed! Verify and trigger print immediately
                await this.verifyAndTrackOrder();
              });
            } else {
              await this.verifyAndTrackOrder();
            }

          } catch (err) {
            this.errorMessage = err.message || 'Payment error';
            this.loading = false;
          }
        },

        async startSandboxOneClickPrint() {
          if (!this.fileList.length) return;
          this.loading = true;
          this.loadingText = 'Finishing Upload...';
          this.errorMessage = '';

          const pending = this.fileList.filter(f => f.status !== 'done');
          if (pending.length > 0) {
            pending.forEach(f => { if (f.status === 'pending') this.uploadSingleFile(f.id); });
            const ok = await this.waitForAllUploads();
            if (!ok) {
              this.loading = false;
              this.errorMessage = 'Upload failed. Tap Retry.';
              return;
            }
          }

          try {
            this.loadingText = 'Simulating Print...';
            const uploadedFiles = this.fileList.map(item => ({
              fileKey: item.uploadedMeta.fileKey,
              originalFilename: item.uploadedMeta.originalFilename,
              fileSize: item.uploadedMeta.fileSize,
              mimeType: item.uploadedMeta.mimeType,
              pageCount: item.activePages || item.uploadedMeta.pageCount || 1,
              pageRange: item.pageRange || (this.showRangeInput ? this.customPageRange : undefined),
              copies: item.copies || this.copies || 1,
              colorMode: (item.colorMode && item.colorMode !== 'default') ? item.colorMode : this.colorMode
            }));

            const orderRes = await fetch('/api/orders', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                shopSlug: this.shopSlug,
                customerName: this.customerName ? this.customerName.trim() : undefined,
                files: uploadedFiles,
                printOptions: {
                  copies: this.copies,
                  colorMode: this.colorMode,
                  duplexMode: this.duplexMode,
                  paperSize: 'A4',
                  orientation: 'portrait',
                  pagesPerSheet: this.pagesPerSheet || 1,
                  pageRange: this.showRangeInput ? this.customPageRange : undefined,
                  stampPaperMode: this.stampPaperMode
                }
              })
            });

            const orderData = await orderRes.json();
            this.orderId = orderData.orderId;
            this.orderCode = '#' + orderData.orderId.slice(-4).toUpperCase();

            const simRes = await fetch(`/api/orders/${this.orderId}/simulate-sandbox-payment`, { method: 'POST' });
            const simData = await simRes.json();
            if (simData.isPaid) {
              this.view = 'tracking';
              this.loading = false;
              this.startPolling();
            }
          } catch (err) {
            this.errorMessage = err.message;
            this.loading = false;
          }
        },

        async verifyAndTrackOrder() {
          try {
            this.loadingText = 'Confirming Payment & Sending to Printer...';
            await fetch(`/api/orders/${this.orderId}/verify-payment`, { method: 'POST' });
            this.clearDraftSession();
            this.view = 'tracking';
            this.loading = false;
            this.startPolling();
          } catch (e) {
            this.view = 'tracking';
            this.loading = false;
            this.startPolling();
          }
        },

        startPolling() {
          if (this.pollTimer) clearInterval(this.pollTimer);
          const checkStatus = async () => {
            if (!this.orderId) return;
            try {
              const res = await fetch(`/api/orders/${this.orderId}`);
              if (res.ok) {
                const data = await res.json();
                this.orderStatus = data.status;
                if (data.payAtCounter) this.isPayAtCounterOrder = true;
                if (data.jobStatus) this.jobStatus = data.jobStatus;
                if (data.queuePosition) this.queuePos = data.queuePosition;

                if (data.jobStatus === 'COMPLETED' || data.status === 'COMPLETED') {
                  this.jobStatus = 'COMPLETED';
                  this.orderStatus = 'COMPLETED';
                  if (this.pollTimer) clearInterval(this.pollTimer);
                }
              }
            } catch (_) {}
          };
          checkStatus();
          this.pollTimer = setInterval(checkStatus, 1000);
        },

        downloadReceipt() {
          const shopName = this.shopInfo?.name || 'QrPrintDesk';
          const code = this.orderCode || '#----';
          const date = new Date().toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
          const mode = this.colorMode === 'color' ? 'Color' : 'B&W';
          const duplex = this.duplexMode === 'duplexlong' ? 'Double-Sided' : 'Single-Sided';
          const payMode = this.isPayAtCounterOrder ? 'Pay at Counter (Cash)' : 'Paid Online';
          const amount = `Rs.${this.totalPriceRupees}`;
          const fileRows = this.fileList.map(f =>
            `<tr><td style="padding:4px 8px;">${f.name}</td><td style="padding:4px 8px;text-align:right;">${f.pageCount} pg</td></tr>`
          ).join('');

          const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Receipt ${code}</title>
<style>body{font-family:Arial,sans-serif;max-width:360px;margin:20px auto;font-size:13px;color:#0f172a;}
h2{text-align:center;font-size:17px;margin:0 0 2px;}
.sub{text-align:center;color:#64748b;font-size:11px;margin-bottom:14px;}
hr{border:none;border-top:1px dashed #cbd5e1;margin:10px 0;}
table{width:100%;border-collapse:collapse;}
th{background:#f1f5f9;padding:4px 8px;text-align:left;font-size:11px;}
.row{display:flex;justify-content:space-between;padding:3px 0;}
.label{color:#64748b;}
.total{font-size:16px;font-weight:700;color:#059669;text-align:center;margin:12px 0;}
.footer{text-align:center;font-size:11px;color:#94a3b8;margin-top:16px;}
@media print{body{margin:0;}button{display:none;}}</style></head>
<body>
<h2>${shopName}</h2>
<div class="sub">Cloud Print Receipt</div>
<hr>
<div class="row"><span class="label">Order Code</span><strong>${code}</strong></div>
<div class="row"><span class="label">Date</span><span>${date}</span></div>
<div class="row"><span class="label">Payment</span><span>${payMode}</span></div>
<hr>
<table><thead><tr><th>Document</th><th style="text-align:right;">Pages</th></tr></thead>
<tbody>${fileRows}</tbody></table>
<hr>
<div class="row"><span class="label">Print Mode</span><span>${mode} · ${duplex}</span></div>
<div class="row"><span class="label">Copies</span><span>${this.copies}</span></div>
<div class="row"><span class="label">Pages/Sheet</span><span>${this.pagesPerSheet === 2 ? '2-in-1' : 'Standard'}</span></div>
<hr>
<div class="total">Total: ${amount}</div>
<hr>
<div class="footer">Thank you for printing with ${shopName}!<br>Keep this receipt for your records.</div>
<br><button onclick="window.print()" style="width:100%;padding:10px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;">Print / Save PDF</button>
</body></html>`;

          const blob = new Blob([html], { type: 'text/html' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `Receipt_${code.replace('#', '')}_${Date.now()}.html`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 5000);
        },

        resetToUpload() {
          if (this.pollTimer) clearInterval(this.pollTimer);
          this.view = 'upload';
          this.fileList.forEach(f => {
            if (f.xhr && f.status === 'uploading') try { f.xhr.abort(); } catch (_) {}
            if (f.previewUrl) try { URL.revokeObjectURL(f.previewUrl); } catch (_) {}
          });
          this.cancelIDCardFlow();
          this.fileList = [];
          this.totalRawPages = 1;
          this.activePrintPages = 1;
          this.customPageRange = '';
          this.showRangeInput = false;
          this.orderId = '';
          this.errorMessage = '';
        }
      };
    }
  </script>
</body>
