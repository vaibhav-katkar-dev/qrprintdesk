<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ShopPrint - Mobile Print Counter</title>
  <script defer src="/vendor/alpine.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-subtle: #eff6ff;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --border: #e2e8f0;
      --success: #16a34a;
      --success-subtle: #f0fdf4;
      --warning: #d97706;
      --danger: #dc2626;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px 14px; display: flex; justify-content: center; -webkit-font-smoothing: antialiased; }
    .container { width: 100%; max-width: 490px; }

    /* SVG Icon utility */
    .icon { display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; flex-shrink: 0; }
    .icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; }

    .header { text-align: center; margin-bottom: 20px; }
    .logo-badge {
      width: 46px; height: 46px; border-radius: 12px; background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      display: inline-flex; align-items: center; justify-content: center; color: #fff; margin-bottom: 8px;
      box-shadow: 0 4px 12px rgba(37,99,235,0.3);
    }
    .shop-title { font-size: 22px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; }
    .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 7px; }
    .status-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 3px rgba(34,197,94,0.2); }
    
    .card { background: var(--card); border-radius: var(--radius); padding: 22px; box-shadow: 0 4px 10px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.02); border: 1px solid var(--border); margin-bottom: 16px; }
    .form-group { margin-bottom: 16px; }
    label { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; margin-bottom: 7px; color: #334155; }
    .label-hint { font-size: 11px; font-weight: normal; color: var(--text-muted); }
    input[type="text"], select { width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 9px; font-size: 14px; background: #fff; color: #0f172a; }
    input[type="text"]:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    
    /* File Drop Area */
    .file-drop { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 24px 14px; text-align: center; cursor: pointer; background: #f8fafc; transition: all 0.2s; position: relative; }
    .file-drop:hover, .file-drop.dragover { border-color: var(--primary); background: #eff6ff; }
    .file-icon-wrap { width: 44px; height: 44px; border-radius: 10px; background: #eff6ff; color: var(--primary); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    .file-title { font-weight: 700; font-size: 14px; color: #1e293b; }
    .file-hint { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
    .hidden-file-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

    /* Multiple Files List */
    .files-list { margin-top: 10px; display: flex; flex-direction: column; gap: 7px; }
    .file-item { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 13px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
    .file-item-info { display: flex; align-items: center; gap: 9px; overflow: hidden; }
    .file-type-icon { color: var(--primary); width: 20px; height: 20px; flex-shrink: 0; }
    .file-item-name { font-weight: 600; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px; font-size: 13px; }
    .file-item-size { font-size: 11px; color: var(--text-muted); }
    .file-remove-btn { background: #fee2e2; border: none; color: #dc2626; border-radius: 6px; width: 24px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .file-remove-btn:hover { background: #fca5a5; }
    .combined-badge { display: inline-flex; align-items: center; gap: 5px; background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }

    /* Segmented Options */
    .segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .segmented-3 { grid-template-columns: repeat(3, 1fr); }
    .segmented button {
      padding: 10px 8px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); border-radius: 8px;
      background: #fff; cursor: pointer; color: var(--text-muted); transition: all 0.15s; text-align: center;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .segmented button.active { background: #eff6ff; border-color: var(--primary); color: var(--primary); font-weight: 700; box-shadow: 0 1px 3px rgba(37,99,235,0.08); }

    /* Stepper for copies */
    .stepper { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: #fff; }
    .stepper button { width: 48px; height: 42px; border: none; background: #f1f5f9; font-size: 19px; font-weight: 700; cursor: pointer; color: #1e293b; }
    .stepper button:active { background: #e2e8f0; }
    .stepper span { flex: 1; text-align: center; font-size: 16px; font-weight: 700; }

    /* Live Interactive Paper Preview */
    .preview-card { background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%); border: 1px solid #cbd5e1; border-radius: 12px; padding: 16px 14px; margin-bottom: 16px; }
    .preview-header { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 800; color: #64748b; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.6px; }
    .preview-viewport { display: flex; justify-content: center; align-items: center; min-height: 140px; padding: 8px 0; perspective: 600px; }
    
    /* Paper Sheet Mockup */
    .sheet-mockup {
      background: #ffffff;
      box-shadow: 0 8px 20px -4px rgba(0,0,0,0.14), 0 2px 6px -1px rgba(0,0,0,0.06);
      border-radius: 4px;
      border: 1px solid #e2e8f0;
      position: relative;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      overflow: hidden;
      padding: 8px;
    }
    .sheet-mockup.portrait { width: 110px; height: 154px; flex-direction: column; }
    .sheet-mockup.landscape { width: 165px; height: 116px; flex-direction: row; }

    .mock-page { flex: 1; display: flex; flex-direction: column; justify-content: space-between; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 3px; padding: 6px 5px; }
    .mock-page:not(:last-child) { margin-right: 6px; }
    .mock-line { height: 4px; background: #94a3b8; border-radius: 2px; margin-bottom: 4px; }
    .mock-line.short { width: 60%; }
    .mock-line.accent { background: var(--primary); }
    .mock-line.color-acc { background: #ec4899; }
    .mock-tag { font-size: 9px; font-weight: 800; color: #64748b; text-align: center; background: #e2e8f0; padding: 2px 4px; border-radius: 2px; }

    /* Live Summary Badges */
    .preview-summary { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; justify-content: center; }
    .summary-pill { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: #fff; color: #334155; border: 1px solid #cbd5e1; display: inline-flex; align-items: center; gap: 5px; }
    .summary-pill.eco { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; font-weight: 800; }
    .summary-pill.price { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; font-weight: 800; font-size: 12px; }

    /* Primary Submit Button */
    .btn-submit { width: 100%; background: var(--primary); color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; transition: background 0.15s; margin-top: 8px; box-shadow: 0 4px 12px rgba(37,99,235,0.25); display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-submit:hover { background: var(--primary-hover); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }

    /* Progress Bar */
    .progress-bar-container { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-top: 12px; }
    .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.2s; }

    /* Status Screen */
    .code-display { text-align: center; padding: 22px; background: #f8fafc; border-radius: 12px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
    .code-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); font-weight: 800; }
    .code-number { font-size: 52px; font-weight: 900; color: #0f172a; letter-spacing: 4px; margin: 4px 0; font-family: ui-monospace, SFMono-Regular, monospace; }
    .code-sub { font-size: 13px; color: #475569; }

    .stepper-status { margin: 20px 0; }
    .status-step { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; position: relative; }
    .status-step:not(:last-child)::after { content: ''; position: absolute; left: 14px; top: 28px; width: 2px; height: calc(100% - 10px); background: #e2e8f0; }
    .step-circle { width: 30px; height: 30px; border-radius: 50%; background: #e2e8f0; color: #64748b; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; z-index: 1; }
    .status-step.active .step-circle { background: var(--primary); color: #fff; box-shadow: 0 0 0 4px rgba(37,99,235,0.2); }
    .status-step.done .step-circle { background: var(--success); color: #fff; }
    .step-info { flex: 1; padding-top: 4px; }
    .step-label { font-size: 14px; font-weight: 700; }
    .step-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .alert { padding: 13px 15px; border-radius: 9px; font-size: 13px; margin-top: 14px; line-height: 1.4; display: flex; align-items: center; gap: 10px; }
    .alert-danger { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .alert-success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
  </style>
</head>
<body x-data="customerApp()" x-init="init()">
  <div class="container">
    <div class="header">
      <div class="logo-badge">
        <span class="icon" style="width: 24px; height: 24px;">
          <svg viewBox="0 0 24 24"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
        </span>
      </div>
      <div class="shop-title" x-text="config.shopName || 'ShopPrint Station'"></div>
      <div class="subtitle">
        <span class="status-dot"></span>
        <span>Instant Counter Mobile Print System</span>
      </div>
    </div>

    <!-- Step 1: Upload & Print Setup Form -->
    <template x-if="view === 'upload'">
      <div class="card">
        <form @submit.prevent="submitJob">

          <!-- 1. File Selection -->
          <div class="form-group">
            <label>
              <span>1. Choose Document(s) or Photo(s)</span>
              <span class="label-hint">PDF, JPG, PNG (Max 25 MB)</span>
            </label>
            <div class="file-drop" :class="{ 'dragover': isDragging }">
              <input type="file" class="hidden-file-input" accept=".pdf,image/jpeg,image/png" multiple @change="onFilesSelected">
              <div class="file-icon-wrap">
                <span class="icon" style="width: 22px; height: 22px;">
                  <svg x-show="selectedFiles.length === 0" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                  <svg x-show="selectedFiles.length > 0" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                </span>
              </div>
              <div class="file-title" x-text="selectedFiles.length > 0 ? '+ Tap to add more files' : 'Tap to select document(s)'"></div>
              <div class="file-hint" x-text="selectedFiles.length > 0 ? `${selectedFiles.length} file(s) selected · will be merged cleanly` : 'Supports multi-page PDFs or camera photo uploads'"></div>
            </div>

            <!-- List of Selected Files -->
            <template x-if="selectedFiles.length > 0">
              <div class="files-list">
                <template x-for="(f, idx) in selectedFiles" :key="idx">
                  <div class="file-item">
                    <div class="file-item-info">
                      <span class="icon file-type-icon">
                        <svg x-show="f.name.toLowerCase().endsWith('.pdf')" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        <svg x-show="!f.name.toLowerCase().endsWith('.pdf')" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                      </span>
                      <div>
                        <div class="file-item-name" x-text="f.name"></div>
                        <div class="file-item-size" x-text="formatBytes(f.size)"></div>
                      </div>
                    </div>
                    <button type="button" class="file-remove-btn" @click="removeFile(idx)" title="Remove file">
                      <span class="icon" style="width: 14px; height: 14px;"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
                    </button>
                  </div>
                </template>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px;">
                  <span class="combined-badge" x-show="selectedFiles.length > 1">
                    <span class="icon" style="width: 12px; height: 12px;"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
                    <span>Merged into 1 print order</span>
                  </span>
                  <span style="font-size: 11px; color: var(--text-muted); font-weight: 700; margin-left: auto;" x-text="`Total Size: ${formatBytes(totalSelectedBytes)}`"></span>
                </div>
              </div>
            </template>
          </div>

          <!-- 2. Live Interactive Paper Preview -->
          <div class="preview-card" x-show="selectedFiles.length > 0">
            <div class="preview-header">
              <span>Live Print Preview</span>
              <span x-text="previewPaperLabel"></span>
            </div>

            <div class="preview-viewport">
              <div class="sheet-mockup" :class="previewSheetClass">
                <!-- 1 on 1 Layout -->
                <template x-if="pagesPerSheet === 1">
                  <div class="mock-page">
                    <div>
                      <div class="mock-line" :class="colorMode === 'color' ? 'accent' : ''"></div>
                      <div class="mock-line" :class="colorMode === 'color' ? 'color-acc' : ''"></div>
                      <div class="mock-line short"></div>
                    </div>
                    <div class="mock-tag" x-text="duplexMode === 'duplexlong' ? 'Page 1 (Front)' : 'Page 1'"></div>
                  </div>
                </template>

                <!-- 2 on 1 Layout -->
                <template x-if="pagesPerSheet === 2">
                  <div style="display: flex; width: 100%; height: 100%; gap: 6px;">
                    <div class="mock-page">
                      <div>
                        <div class="mock-line" :class="colorMode === 'color' ? 'accent' : ''"></div>
                        <div class="mock-line short"></div>
                      </div>
                      <div class="mock-tag">Page 1</div>
                    </div>
                    <div class="mock-page">
                      <div>
                        <div class="mock-line" :class="colorMode === 'color' ? 'color-acc' : ''"></div>
                        <div class="mock-line short"></div>
                      </div>
                      <div class="mock-tag">Page 2</div>
                    </div>
                  </div>
                </template>
              </div>
            </div>

            <!-- Live Calculation Summary Pills -->
            <div class="preview-summary">
              <span class="summary-pill">
                <span class="icon" style="width: 12px; height: 12px;"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg></span>
                <span x-text="previewSideText"></span>
              </span>
              <span class="summary-pill">
                <span class="icon" style="width: 12px; height: 12px;"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></span>
                <span x-text="orientationLabel"></span>
              </span>
              <span class="summary-pill eco" x-show="isEcoMode">
                <span class="icon" style="width: 12px; height: 12px;"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg></span>
                <span x-text="ecoSavingsText"></span>
              </span>
              <span class="summary-pill price" x-show="config.pricing && config.pricing.enabled">
                <span class="icon" style="width: 12px; height: 12px;"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
                <span>Est: ₹<span x-text="estimatedCost"></span></span>
              </span>
            </div>
          </div>

          <!-- 3. Dynamic Customer Options -->

          <!-- Color Mode (Hidden if disabled by admin) -->
          <div class="form-group" x-show="config.allowColor">
            <label>Color Mode</label>
            <div class="segmented">
              <button type="button" :class="{ 'active': colorMode === 'monochrome' }" @click="colorMode = 'monochrome'">
                <span class="icon" style="width: 14px; height: 14px;"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></span>
                <span>Black & White</span>
              </button>
              <button type="button" :class="{ 'active': colorMode === 'color' }" @click="colorMode = 'color'">
                <span class="icon" style="width: 14px; height: 14px;"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20"/></svg></span>
                <span>Full Color</span>
              </button>
            </div>
          </div>

          <!-- Sides / Duplex Mode (Hidden if disabled by admin) -->
          <div class="form-group" x-show="config.allowDuplex">
            <label>
              <span>Sides</span>
              <span class="label-hint">Double-sided saves paper</span>
            </label>
            <div class="segmented">
              <button type="button" :class="{ 'active': duplexMode === 'simplex' }" @click="duplexMode = 'simplex'">
                <span>1-Sided (Single)</span>
              </button>
              <button type="button" :class="{ 'active': duplexMode === 'duplexlong' }" @click="duplexMode = 'duplexlong'">
                <span class="icon" style="width: 13px; height: 13px;"><svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></span>
                <span>2-Sided (Double)</span>
              </button>
            </div>
          </div>

          <!-- Pages per Sheet: 1 vs 2-on-1 (Hidden if disabled by admin) -->
          <div class="form-group" x-show="config.allow2on1">
            <label>
              <span>Layout (Pages per Sheet)</span>
              <span class="label-hint">Eco Saver</span>
            </label>
            <div class="segmented">
              <button type="button" :class="{ 'active': pagesPerSheet === 1 }" @click="pagesPerSheet = 1">
                <span>Standard (1 Page)</span>
              </button>
              <button type="button" :class="{ 'active': pagesPerSheet === 2 }" @click="pagesPerSheet = 2">
                <span class="icon" style="width: 13px; height: 13px;"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg></span>
                <span>2 on 1 Sheet</span>
              </button>
            </div>
          </div>

          <!-- Orientation (Hidden if disabled by admin) -->
          <div class="form-group" x-show="config.allowOrientation">
            <label>Orientation</label>
            <div class="segmented segmented-3">
              <button type="button" :class="{ 'active': orientation === 'auto' }" @click="orientation = 'auto'">
                <span>Auto</span>
              </button>
              <button type="button" :class="{ 'active': orientation === 'portrait' }" @click="orientation = 'portrait'">
                <span class="icon" style="width: 12px; height: 12px;"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/></svg></span>
                <span>Portrait</span>
              </button>
              <button type="button" :class="{ 'active': orientation === 'landscape' }" @click="orientation = 'landscape'">
                <span class="icon" style="width: 12px; height: 12px;"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/></svg></span>
                <span>Landscape</span>
              </button>
            </div>
          </div>

          <!-- Custom Page Range (Hidden if disabled by admin) -->
          <div class="form-group" x-show="config.allowCustomPages">
            <label>
              <span>Pages to Print</span>
              <span class="label-hint">e.g. 1-5 or 1,3,5</span>
            </label>
            <div class="segmented" style="margin-bottom: 8px;">
              <button type="button" :class="{ 'active': pageRangeMode === 'all' }" @click="pageRangeMode = 'all'; pageRange = ''">
                All Pages
              </button>
              <button type="button" :class="{ 'active': pageRangeMode === 'custom' }" @click="pageRangeMode = 'custom'">
                Selected Range
              </button>
            </div>
            <input type="text" x-show="pageRangeMode === 'custom'" x-model="pageRange" placeholder="e.g. 1-3, 5">
          </div>

          <!-- Number of Copies (Hidden if disabled by admin) -->
          <div class="form-group" x-show="config.allowCopies">
            <label>
              <span>Number of Copies</span>
              <span class="label-hint" x-text="`Max ${config.maxCopies || 20}`"></span>
            </label>
            <div class="stepper">
              <button type="button" @click="copies = Math.max(1, copies - 1)">-</button>
              <span x-text="copies"></span>
              <button type="button" @click="copies = Math.min(config.maxCopies || 20, copies + 1)">+</button>
            </div>
          </div>

          <!-- Paper Size (Hidden if disabled by admin) -->
          <div class="form-group" x-show="config.allowPaperSize">
            <label>Paper Size</label>
            <select x-model="paperSize">
              <option value="A4">A4 (Standard 210 × 297 mm)</option>
              <option value="legal">Legal (Stamp / Court 216 × 356 mm)</option>
              <option value="A3">A3 (Large Format 297 × 420 mm)</option>
              <option value="letter">Letter (216 × 279 mm)</option>
            </select>
          </div>

          <!-- Customer Name -->
          <div class="form-group">
            <label>Your Name (Optional)</label>
            <input type="text" x-model="customerName" placeholder="e.g. Rahul Sharma">
          </div>

          <!-- Special Note -->
          <div class="form-group">
            <label>Special Instructions / Note (Optional)</label>
            <input type="text" x-model="customerNote" placeholder="e.g. Staple top-left or use thick paper" maxlength="200">
          </div>

          <!-- Upload Progress Bar -->
          <div x-show="uploading" style="margin-top: 10px;">
            <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700;">
              <span>Sending securely to Shop Station...</span>
              <span x-text="uploadProgress + '%'"></span>
            </div>
            <div class="progress-bar-container">
              <div class="progress-bar-fill" :style="`width: ${uploadProgress}%`"></div>
            </div>
          </div>

          <!-- Error Alert -->
          <div class="alert alert-danger" x-show="errorMessage">
            <span class="icon" style="width: 16px; height: 16px;"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></span>
            <span x-text="errorMessage"></span>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-submit" :disabled="selectedFiles.length === 0 || uploading">
            <span class="icon" style="width: 16px; height: 16px;"><svg viewBox="0 0 24 24"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg></span>
            <span x-text="uploading ? 'Processing & Uploading...' : submitButtonText"></span>
          </button>
        </form>
      </div>
    </template>

    <!-- Step 2: Live Tracking Screen -->
    <template x-if="view === 'status'">
      <div>
        <div class="card">
          <div class="code-display">
            <div class="code-title">Your Order Pickup Code</div>
            <div class="code-number" x-text="'#' + jobCode"></div>
            <div class="code-sub">Show this 4-digit code at the counter</div>
          </div>

          <div x-show="customerNote" style="background: #fef3c7; border: 1px solid #fde68a; border-radius: 9px; padding: 11px 13px; font-size: 13px; color: #92400e; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
            <span class="icon" style="width: 16px; height: 16px;"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>
            <div><strong>Special Instructions:</strong> <span x-text="customerNote"></span></div>
          </div>

          <div class="stepper-status">
            <!-- Step 1: Uploaded -->
            <div class="status-step" :class="getStepClass('UPLOADED')">
              <div class="step-circle">
                <span class="icon" style="width: 14px; height: 14px;" x-show="isStepDone('UPLOADED')"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
                <span x-show="!isStepDone('UPLOADED')">1</span>
              </div>
              <div class="step-info">
                <div class="step-label">File Received</div>
                <div class="step-desc" x-text="pageCount ? `${pageCount} page(s) · ${copies} copy(ies) · ${paperSize.toUpperCase()}` : 'Processed securely'"></div>
              </div>
            </div>

            <!-- Step 2: Approval -->
            <div class="status-step" :class="getStepClass('PENDING_APPROVAL')">
              <div class="step-circle">
                <span class="icon" style="width: 14px; height: 14px;" x-show="isStepDone('PENDING_APPROVAL')"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
                <span x-show="!isStepDone('PENDING_APPROVAL')">2</span>
              </div>
              <div class="step-info">
                <div class="step-label">Shopkeeper Review</div>
                <div class="step-desc" x-text="currentStatus === 'PENDING_APPROVAL' ? 'Waiting for shopkeeper approval at desk' : 'Reviewed & Approved'"></div>
              </div>
            </div>

            <!-- Step 3: Queued -->
            <div class="status-step" :class="getStepClass('QUEUED')">
              <div class="step-circle">
                <span class="icon" style="width: 14px; height: 14px;" x-show="isStepDone('QUEUED')"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
                <span x-show="!isStepDone('QUEUED')">3</span>
              </div>
              <div class="step-info">
                <div class="step-label">In Print Queue</div>
                <div class="step-desc" x-text="queuePos ? `Position #${queuePos} in queue` : (currentStatus === 'QUEUED' ? 'Ready to print next' : 'Queue passed')"></div>
              </div>
            </div>

            <!-- Step 4: Printing -->
            <div class="status-step" :class="getStepClass('PRINTING')">
              <div class="step-circle">
                <span class="icon" style="width: 14px; height: 14px;" x-show="isStepDone('PRINTING')"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
                <span x-show="!isStepDone('PRINTING')">4</span>
              </div>
              <div class="step-info">
                <div class="step-label">Printing Now</div>
                <div class="step-desc">Sending document to physical printer</div>
              </div>
            </div>

            <!-- Step 5: Finished or Failed -->
            <div class="status-step" :class="getTerminalStepClass()">
              <div class="step-circle">
                <span class="icon" style="width: 14px; height: 14px;" x-show="currentStatus === 'DONE'"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
                <span class="icon" style="width: 14px; height: 14px;" x-show="isFailedState()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></span>
                <span x-show="currentStatus !== 'DONE' && !isFailedState()">5</span>
              </div>
              <div class="step-info">
                <div class="step-label" x-text="currentStatus === 'DONE' ? 'Ready for Pickup!' : (isFailedState() ? 'Job Alert' : 'Pickup Ready')"></div>
                <div class="step-desc" x-text="currentStatus === 'DONE' ? 'Collect your print from the counter' : (failureReason || 'Finalizing...')"></div>
              </div>
            </div>
          </div>

          <div class="alert alert-success" x-show="currentStatus === 'DONE'">
            <span class="icon" style="width: 18px; height: 18px;"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>
            <div><strong>Printing Finished!</strong> Please collect your print at the counter using Code <strong>#<span x-text="jobCode"></span></strong>.</div>
          </div>

          <div class="alert alert-danger" x-show="isFailedState()">
            <span class="icon" style="width: 18px; height: 18px;"><svg viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>
            <div><strong>Notice:</strong> <span x-text="failureReason || 'Printing paused. Please consult the shopkeeper.'"></span></div>
          </div>

          <button class="btn-submit" style="margin-top: 18px; background: #475569;" @click="resetForm">
            <span class="icon" style="width: 15px; height: 15px;"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></span>
            <span>Print Another Document</span>
          </button>
        </div>
      </div>
    </template>
  </div>

  <script>
    function customerApp() {
      return {
        view: 'upload',
        selectedFiles: [],
        copies: 1,
        paperSize: 'A4',
        colorMode: 'monochrome',
        duplexMode: 'simplex',
        pagesPerSheet: 1,
        orientation: 'auto',
        pageRangeMode: 'all',
        pageRange: '',
        customerName: '',
        customerNote: '',
        isDragging: false,
        uploading: false,
        uploadProgress: 0,
        errorMessage: '',
        token: '',
        jobCode: '',
        currentStatus: '',
        failureReason: '',
        queuePos: null,
        pageCount: 0,
        eventSource: null,

        // Dynamic capabilities from server
        config: {
          allowDuplex: true,
          allowColor: true,
          allow2on1: true,
          allowOrientation: true,
          allowCustomPages: true,
          allowCopies: true,
          maxCopies: 20,
          allowPaperSize: false,
          shopName: 'ShopPrint Station',
          defaultDuplex: 'simplex',
          defaultColor: 'monochrome',
          defaultPaperSize: 'A4',
          pricing: {
            enabled: true,
            bwRate: 2.0,
            colorRate: 10.0,
            duplexDiscount: 0.5
          }
        },

        init() {
          // 1. Fetch live configuration from server
          fetch('/api/config')
            .then(r => r.json())
            .then(cfg => {
              if (cfg) {
                this.config = cfg;
                this.colorMode = cfg.defaultColor || 'monochrome';
                this.duplexMode = cfg.defaultDuplex || 'simplex';
                this.paperSize = cfg.defaultPaperSize || 'A4';
              }
            })
            .catch(() => {});

          // 2. Check for existing active tracking session
          const savedToken = localStorage.getItem('shopprint_current_token');
          if (savedToken) {
            this.resumeTracking(savedToken);
          }
        },

        get totalSelectedBytes() {
          return this.selectedFiles.reduce((acc, f) => acc + f.size, 0);
        },

        get previewPaperLabel() {
          return `${this.paperSize.toUpperCase()} · ${this.orientation === 'landscape' ? 'Landscape' : (this.orientation === 'portrait' ? 'Portrait' : 'Auto')}`;
        },

        get previewSheetClass() {
          if (this.pagesPerSheet === 2 || this.orientation === 'landscape') {
            return 'landscape';
          }
          return 'portrait';
        },

        get previewSideText() {
          return this.duplexMode === 'duplexlong' ? 'Double-Sided' : 'Single-Sided';
        },

        get orientationLabel() {
          if (this.pagesPerSheet === 2) return '2-on-1 Eco';
          return this.orientation === 'landscape' ? 'Landscape' : (this.orientation === 'portrait' ? 'Portrait' : 'Auto Orient');
        },

        get isEcoMode() {
          return this.pagesPerSheet === 2 || this.duplexMode === 'duplexlong';
        },

        get ecoSavingsText() {
          if (this.pagesPerSheet === 2 && this.duplexMode === 'duplexlong') {
            return '75% Paper Saved';
          }
          return '50% Paper Saved';
        },

        get estimatedCost() {
          if (!this.config.pricing || !this.config.pricing.enabled) return '0.00';
          const bwRate = this.config.pricing.bwRate || 2.0;
          const colorRate = this.config.pricing.colorRate || 10.0;
          const duplexDisc = this.config.pricing.duplexDiscount || 0.5;
          const rate = this.colorMode === 'color' ? colorRate : bwRate;

          const estRawPages = Math.max(1, this.selectedFiles.length);
          const estProcessedPages = this.pagesPerSheet === 2 ? Math.ceil(estRawPages / 2) : estRawPages;
          let discPages = 0;
          if (this.duplexMode === 'duplexlong') {
            discPages = Math.floor(estProcessedPages / 2);
          }
          const perCopy = (estProcessedPages * rate) - (discPages * duplexDisc);
          const total = Math.max(0, perCopy * this.copies);
          return total.toFixed(2);
        },

        get submitButtonText() {
          if (this.selectedFiles.length === 0) return 'Select File(s) to Print';
          const fileCountText = this.selectedFiles.length > 1 ? `Print All (${this.selectedFiles.length} Combined)` : 'Send to Printer';
          if (this.config.pricing && this.config.pricing.enabled) {
            return `${fileCountText} · ₹${this.estimatedCost}`;
          }
          return fileCountText;
        },

        onFilesSelected(e) {
          const files = Array.from(e.target.files);
          if (!files.length) return;

          for (const f of files) {
            const ext = f.name.toLowerCase();
            if (!ext.endsWith('.pdf') && !ext.endsWith('.jpg') && !ext.endsWith('.jpeg') && !ext.endsWith('.png')) {
              this.errorMessage = 'Unsupported format: ' + f.name + '. Please select PDF, JPG or PNG.';
              return;
            }
            if (f.size > 25 * 1024 * 1024) {
              this.errorMessage = 'File too large: ' + f.name + ' exceeds 25 MB.';
              return;
            }
            this.selectedFiles.push(f);
          }
          this.errorMessage = '';
          e.target.value = '';
        },

        removeFile(index) {
          this.selectedFiles.splice(index, 1);
        },

        formatBytes(bytes) {
          if (bytes === 0) return '0 B';
          const k = 1024;
          const sizes = ['B', 'KB', 'MB'];
          const i = Math.floor(Math.log(bytes) / Math.log(k));
          return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        },

        submitJob() {
          if (this.selectedFiles.length === 0) {
            this.errorMessage = 'Please select at least one document or photo to print.';
            return;
          }

          this.uploading = true;
          this.uploadProgress = 0;
          this.errorMessage = '';

          const formData = new FormData();
          this.selectedFiles.forEach(f => {
            formData.append('files', f);
          });

          formData.append('copies', this.copies);
          formData.append('paper_size', this.paperSize);
          formData.append('color_mode', this.colorMode);
          formData.append('duplex_mode', this.duplexMode);
          formData.append('pages_per_sheet', this.pagesPerSheet);
          formData.append('orientation', this.orientation);
          formData.append('page_range', this.pageRangeMode === 'custom' ? this.pageRange : 'all');
          formData.append('fit_mode', 'fit');
          formData.append('customer_name', this.customerName);
          formData.append('customer_note', this.customerNote);

          const xhr = new XMLHttpRequest();
          xhr.open('POST', '/api/jobs/upload', true);

          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
              this.uploadProgress = Math.round((e.loaded / e.total) * 100);
            }
          };

          xhr.onload = () => {
            this.uploading = false;
            try {
              const res = JSON.parse(xhr.responseText);
              if (xhr.status === 201 && res.success) {
                this.token = res.token;
                this.jobCode = res.code;
                this.currentStatus = res.status;
                this.pageCount = res.pageCount;
                localStorage.setItem('shopprint_current_token', this.token);
                this.view = 'status';
                this.startSSE();
              } else {
                this.errorMessage = res.error || 'Upload error. Please try again.';
              }
            } catch (err) {
              this.errorMessage = 'Invalid response received from server.';
            }
          };

          xhr.onerror = () => {
            this.uploading = false;
            this.errorMessage = 'Network error while uploading. Please retry.';
          };

          xhr.send(formData);
        },

        resumeTracking(token) {
          this.token = token;
          fetch(`/api/jobs/${token}`)
            .then(r => r.json())
            .then(data => {
              if (data && data.code) {
                this.jobCode = data.code;
                this.currentStatus = data.status;
                this.failureReason = data.failureReason;
                this.queuePos = data.position;
                this.pageCount = data.pageCount;
                this.copies = data.copies;
                if (data.paperSize) this.paperSize = data.paperSize;
                if (data.fitMode) this.fitMode = data.fitMode;
                if (data.customerNote !== undefined) this.customerNote = data.customerNote;
                this.view = 'status';
                this.startSSE();
              } else {
                localStorage.removeItem('shopprint_current_token');
              }
            })
            .catch(() => {
              localStorage.removeItem('shopprint_current_token');
            });
        },

        startSSE() {
          if (this.eventSource) {
            this.eventSource.close();
          }

          this.eventSource = new EventSource(`/api/jobs/${this.token}/sse`);

          this.eventSource.onmessage = (event) => {
            try {
              const data = JSON.parse(event.data);
              this.currentStatus = data.status;
              this.failureReason = data.failureReason;
              this.queuePos = data.position;
              if (data.pageCount) this.pageCount = data.pageCount;
              if (data.paperSize) this.paperSize = data.paperSize;
              if (data.fitMode) this.fitMode = data.fitMode;
              if (data.customerNote !== undefined) this.customerNote = data.customerNote;
            } catch (err) {}
          };
        },

        getStepClass(step) {
          const order = ['UPLOADED', 'PENDING_APPROVAL', 'QUEUED', 'PRINTING', 'DONE'];
          const currentIndex = order.indexOf(this.currentStatus);
          const stepIndex = order.indexOf(step);

          if (this.currentStatus === 'DONE') return 'done';
          if (this.isFailedState()) {
            return stepIndex <= currentIndex ? 'done' : '';
          }
          if (currentIndex === stepIndex) return 'active';
          if (currentIndex > stepIndex) return 'done';
          return '';
        },

        isStepDone(step) {
          const order = ['UPLOADED', 'PENDING_APPROVAL', 'QUEUED', 'PRINTING', 'DONE'];
          const currentIndex = order.indexOf(this.currentStatus);
          const stepIndex = order.indexOf(step);
          return this.currentStatus === 'DONE' || currentIndex > stepIndex;
        },

        isFailedState() {
          return ['FAILED', 'REJECTED', 'CANCELLED', 'CHECK_REPRINT'].includes(this.currentStatus);
        },

        getTerminalStepClass() {
          if (this.currentStatus === 'DONE') return 'done';
          if (this.isFailedState()) return 'active';
          return '';
        },

        resetForm() {
          if (this.eventSource) this.eventSource.close();
          localStorage.removeItem('shopprint_current_token');
          this.view = 'upload';
          this.selectedFiles = [];
          this.token = '';
          this.jobCode = '';
          this.currentStatus = '';
          this.failureReason = '';
          this.errorMessage = '';
          this.uploadProgress = 0;
          this.customerNote = '';
          this.paperSize = this.config.defaultPaperSize || 'A4';
          this.colorMode = this.config.defaultColor || 'monochrome';
          this.duplexMode = this.config.defaultDuplex || 'simplex';
          this.pagesPerSheet = 1;
          this.orientation = 'auto';
          this.pageRangeMode = 'all';
          this.pageRange = '';
        }
      };
    }
  </script>
</body>
</html>
