<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopPrint — Starting...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 28px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 8px;
  }
  .logo-icon {
    width: 54px; height: 54px;
    background: #3b82f6;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-icon svg { width: 32px; height: 32px; fill: white; }
  .logo-text { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .logo-text span { color: #3b82f6; }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid #1e3a5f;
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { font-size: 16px; color: #94a3b8; }
  .retry  { font-size: 13px; color: #475569; margin-top: -12px; }
  .bar-wrap {
    width: 220px; height: 4px;
    background: #1e293b; border-radius: 4px; overflow: hidden;
  }
  .bar-fill {
    height: 100%; background: #3b82f6; border-radius: 4px;
    animation: fill 3s ease-in forwards;
  }
  @keyframes fill { from { width: 0%; } to { width: 100%; } }
</style>
</head>
<body>
<div class="logo">
  <div class="logo-icon">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 2h12v6H6zM4 9h16a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2v3H6v-3H4a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2zm2 3v6h12v-6H6zm10-2a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
    </svg>
  </div>
  <div class="logo-text">Shop<span>Print</span></div>
</div>
<div class="spinner"></div>
<div class="status">Starting ShopPrint server...</div>
<div class="bar-wrap"><div class="bar-fill"></div></div>
<div class="retry" id="msg">Connecting...</div>
<script>
  let attempt = 0;
  const adminUrl = 'http://localhost:3000/admin';
  const msg = document.getElementById('msg');

  function tryConnect() {
    attempt++;
    msg.textContent = 'Attempt ' + attempt + '...';
    fetch(adminUrl, { method: 'HEAD', cache: 'no-store' })
      .then(r => {
        if (r.ok || r.status < 500) {
          // Server is up — redirect immediately
          window.location.replace(adminUrl);
        } else {
          setTimeout(tryConnect, 600);
        }
      })
      .catch(() => setTimeout(tryConnect, 600));
  }

  // Start polling after a tiny delay so the loading page renders first
  setTimeout(tryConnect, 400);
</script>
</body>
</html>
