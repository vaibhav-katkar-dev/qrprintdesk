        <!-- ============================================== -->
        <!-- MODAL 2: CHANGE MASTER PIN                     -->
        <!-- ============================================== -->
        <template x-if="pinModalOpen">
          <div class="modal-overlay" @click.self="pinModalOpen = false">
            <div class="modal-content" style="max-width: 400px;">
              <div class="modal-header">
                <div class="modal-title">
                  <span class="icon" style="width: 18px; height: 18px;"><svg viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg></span>
                  <span>Change Master PIN</span>
                </div>
                <button class="modal-close" @click="pinModalOpen = false">
                  <span class="icon" style="width: 18px; height: 18px;"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
                </button>
              </div>

              <form @submit.prevent="submitPinChange">
                <div style="margin-bottom: 14px;">
                  <label style="font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Current PIN:</label>
                  <input type="password" x-model="pinChangeCurrent" placeholder="Current PIN" required style="margin-top: 4px;">
                </div>

                <div style="margin-bottom: 14px;">
                  <label style="font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">New PIN (4+ digits):</label>
                  <input type="password" x-model="pinChangeNew" placeholder="New PIN" required minlength="4" maxlength="8" style="margin-top: 4px;">
                </div>

                <div style="color: var(--danger); font-size: 13px; margin-bottom: 12px;" x-show="pinChangeError" x-text="pinChangeError"></div>
                <div style="color: var(--success); font-size: 13px; margin-bottom: 12px;" x-show="pinChangeSuccess" x-text="pinChangeSuccess"></div>

                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                  <button type="button" class="btn btn-secondary" @click="pinModalOpen = false">Cancel</button>
                  <button type="submit" class="btn btn-primary">Update PIN</button>
                </div>
              </form>
            </div>
          </div>
        </template>

      </div>
    </template>
  </div>

  <script>
    // Robust Sound & Audio Chime System
    const audioStation = {
      ctx: null,
      unlocked: false,
      ensureUnlocked() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          this.unlocked = true;
        } catch (e) {}
      },
      playChime() {
        this.ensureUnlocked();
        if (!this.ctx) return;
        try {
          if (this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          const now = this.ctx.currentTime;
          
          // Pleasant high-quality counter chime (Ding-Dong: D5 -> A5)
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          const gain2 = this.ctx.createGain();

          // Tone 1: 587.33 Hz (D5)
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(587.33, now);
          gain1.gain.setValueAtTime(0.25, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);

          // Tone 2: 880.00 Hz (A5)
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880.0, now + 0.12);
          gain2.gain.setValueAtTime(0.3, now + 0.12);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);

          osc1.start(now);
          osc1.stop(now + 0.35);
          osc2.start(now + 0.12);
          osc2.stop(now + 0.6);
        } catch (err) {
          console.warn('Audio playback error:', err);
        }
      }
    };

    // Unlock browser audio upon first user click, touch or keydown
    ['click', 'touchstart', 'keydown'].forEach(evt => {
      document.addEventListener(evt, () => audioStation.ensureUnlocked(), { passive: true, once: false });
    });

    function adminApp() {
      return {
        isPinSet: false,
        isAuthenticated: false,
        pinInput: '',
        authError: '',
        currentSection: 'queue', // 'queue' or 'settings'

        serverUrl: '',
        localIp: '',
        publicUrl: '',
        qrDataUrl: '',
        printers: [],
        selectedPrinter: '',
        autoPrint: false,
        queuePaused: false,
        privacyMode: false,
        defaultPaperSize: 'A4',
        defaultFitMode: 'fit',
        allowDuplex: true,
        allowColor: true,
        allow2on1: true,
        allowOrientation: true,
        allowCustomPages: true,
        allowCopies: true,
        maxCopies: 20,
        allowPaperSize: false,
        shopName: 'ShopPrint Station',
        enablePricing: true,
        priceBwPerPage: '2.00',
        priceColorPerPage: '10.00',
        priceDuplexDiscount: '0.50',
        soundEnabled: localStorage.getItem('shopprint_sound') !== 'false',
        freeDiskMB: 0,
        jobs: [],
        printerAlert: '',
        eventSource: null,
        pollInterval: null,
        copiedUrl: false,

        // Incoming job detection
        knownJobIds: new Set(),
        hasLoadedJobsOnce: false,
        hasLoadedSettingsOnce: false,
        isSavingSettings: false,
        settingsSavedToast: false,

        // Queue Filtering & Search
        searchQuery: '',
        activeTab: 'ALL',

        // Edit Modal State
        editModalOpen: false,
        editForm: {
          id: null,
          code: '',
          customerName: '',
          copies: 1,
          paperSize: 'A4',
          colorMode: 'monochrome',
          duplexMode: 'simplex',
          pagesPerSheet: 1,
          orientation: 'auto',
          fitMode: 'fit'
        },

        // PIN Change Modal State
        pinModalOpen: false,
        pinChangeCurrent: '',
        pinChangeNew: '',
        pinChangeError: '',
        pinChangeSuccess: '',
        purgingSpooler: false,

        // Tunnel Management State
        tunnelStatus: 'disconnected',
        tunnelToken: '',
        tunnelPublicUrl: '',
        tunnelId: '',
        tunnelHasToken: false,
        tunnelLoading: false,
        tunnelSaving: false,
        tunnelSaveMsg: '',
        tunnelSaveError: false,
        tunnelTesting: false,
        tunnelTestResult: '',
        tunnelTestOk: false,

        get pendingApprovalCount() {
          return this.jobs.filter(j => j.status === 'PENDING_APPROVAL').length;
        },
        get queuedCount() {
          return this.jobs.filter(j => j.status === 'QUEUED').length;
        },
        get printingCount() {
          return this.jobs.filter(j => j.status === 'PRINTING').length;
        },
        get doneCount() {
          return this.jobs.filter(j => j.status === 'DONE').length;
        },
        get isSelectedPrinterOffline() {
          if (!this.selectedPrinter || !this.printers || this.printers.length === 0) return false;
          const p = this.printers.find(pr => pr.name.toLowerCase() === this.selectedPrinter.toLowerCase());
          return p ? Boolean(p.isOffline) : false;
        },
        get failedCount() {
          return this.jobs.filter(j => ['FAILED', 'CHECK_REPRINT', 'REJECTED', 'CANCELLED'].includes(j.status)).length;
        },

        get filteredJobs() {
          let list = this.jobs;

          if (this.activeTab !== 'ALL') {
            if (this.activeTab === 'FAILED') {
              list = list.filter(j => ['FAILED', 'CHECK_REPRINT', 'REJECTED', 'CANCELLED'].includes(j.status));
            } else {
              list = list.filter(j => j.status === this.activeTab);
            }
          }

          if (this.searchQuery.trim()) {
            const q = this.searchQuery.trim().toLowerCase();
            list = list.filter(j => {
              const code = (j.code || '').toLowerCase();
              const name = (j.customer_name || '').toLowerCase();
              const file = (j.original_filename || '').toLowerCase();
              const note = (j.customer_note || '').toLowerCase();
              return code.includes(q) || name.includes(q) || file.includes(q) || note.includes(q);
            });
          }

          return list;
        },

        init() {
          this.checkAuth();
        },

        toggleSound() {
          audioStation.ensureUnlocked();
          this.soundEnabled = !this.soundEnabled;
          localStorage.setItem('shopprint_sound', this.soundEnabled);
          if (this.soundEnabled) {
            audioStation.playChime();
          }
        },

        testSound() {
          audioStation.ensureUnlocked();
          audioStation.playChime();
        },

        copyServerUrl() {
          if (navigator.clipboard && this.serverUrl) {
            navigator.clipboard.writeText(this.serverUrl).then(() => {
              this.copiedUrl = true;
              setTimeout(() => { this.copiedUrl = false; }, 2000);
            });
          }
        },

        checkAuth() {
          fetch('/api/admin/auth-status')
            .then(r => r.json())
            .then(data => {
              this.isPinSet = data.pinSet;
              this.isAuthenticated = data.authenticated;
              if (this.isAuthenticated) {
                audioStation.ensureUnlocked();
                this.fetchStatus();
                this.startAdminSSE();
              }
            })
            .catch(() => {});
        },

        handleAuthSubmit() {
          audioStation.ensureUnlocked();
          this.authError = '';
          const endpoint = this.isPinSet ? '/api/admin/login' : '/api/admin/setup-pin';
          fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin: (this.pinInput || '').toString().trim() })
          })
          .then(r => r.json())
          .then(data => {
            if (data.success) {
              this.isAuthenticated = true;
              this.pinInput = '';
              audioStation.ensureUnlocked();
              this.fetchStatus();
              this.startAdminSSE();
            } else {
              this.authError = data.error || 'Authentication failed.';
            }
          })
          .catch(() => {
            this.authError = 'Network error.';
          });
        },

        logout() {
          fetch('/api/admin/logout', { method: 'POST' }).then(() => {
            this.isAuthenticated = false;
            if (this.eventSource) this.eventSource.close();
            if (this.pollInterval) { clearInterval(this.pollInterval); this.pollInterval = null; }
            this.checkAuth();
          });
        },

        fetchStatus(forceSettings = false) {
          fetch('/api/admin/status')
            .then(r => {
              if (r.status === 401) {
                this.isAuthenticated = false;
                return null;
              }
              return r.json();
            })
            .then(data => {
              if (!data) return;

              // Operational telemetry that always updates cleanly
              this.serverUrl = data.serverUrl;
              this.localIp = data.localIp;
              this.qrDataUrl = data.qrDataUrl;
              this.printers = data.printers || [];
              this.freeDiskMB = data.freeDiskMB;
              this.queuePaused = data.queuePaused;

              // Guard: Check if shopkeeper is actively typing into an input field or modal
              const isUserTyping = document.activeElement && 
                (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'SELECT');

              // ONLY update editable settings on first load or upon explicit save, and NEVER when user is actively typing!
              if ((!this.hasLoadedSettingsOnce || forceSettings) && !isUserTyping) {
                this.publicUrl = data.publicUrl || '';
                this.selectedPrinter = data.selectedPrinter;
                this.autoPrint = data.autoPrint;
                this.privacyMode = data.privacyMode;
                if (data.defaultPaperSize) this.defaultPaperSize = data.defaultPaperSize;
                if (data.defaultFitMode) this.defaultFitMode = data.defaultFitMode;
                if (data.allowDuplex !== undefined) this.allowDuplex = data.allowDuplex;
                if (data.allowColor !== undefined) this.allowColor = data.allowColor;
                if (data.allow2on1 !== undefined) this.allow2on1 = data.allow2on1;
                if (data.allowOrientation !== undefined) this.allowOrientation = data.allowOrientation;
                if (data.allowCustomPages !== undefined) this.allowCustomPages = data.allowCustomPages;
                if (data.allowCopies !== undefined) this.allowCopies = data.allowCopies;
                if (data.maxCopies !== undefined) this.maxCopies = data.maxCopies;
                if (data.allowPaperSize !== undefined) this.allowPaperSize = data.allowPaperSize;
                if (data.shopName !== undefined) this.shopName = data.shopName;
                if (data.enablePricing !== undefined) this.enablePricing = data.enablePricing;
                if (data.priceBwPerPage !== undefined) this.priceBwPerPage = data.priceBwPerPage;
                if (data.priceColorPerPage !== undefined) this.priceColorPerPage = data.priceColorPerPage;
                if (data.priceDuplexDiscount !== undefined) this.priceDuplexDiscount = data.priceDuplexDiscount;
                this.hasLoadedSettingsOnce = true;
              }

              // Check for newly arrived print jobs to trigger chime sound!
              const currentJobs = data.jobs || [];
              const incomingJobIds = new Set(currentJobs.map(j => j.id));

              if (this.hasLoadedJobsOnce) {
                let hasNewJob = false;
                for (const id of incomingJobIds) {
                  if (!this.knownJobIds.has(id)) {
                    hasNewJob = true;
                    break;
                  }
                }
                if (hasNewJob && this.soundEnabled) {
                  audioStation.playChime();
                }
              }

              this.knownJobIds = incomingJobIds;
              this.hasLoadedJobsOnce = true;
              this.jobs = currentJobs;
            });
        },

        saveSettings() {
          this.isSavingSettings = true;
          return fetch('/api/admin/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              autoPrint: this.autoPrint,
              selectedPrinter: this.selectedPrinter,
              queuePaused: this.queuePaused,
              privacyMode: this.privacyMode,
              defaultPaperSize: this.defaultPaperSize,
              defaultFitMode: this.defaultFitMode,
              publicUrl: this.publicUrl,
              allowDuplex: this.allowDuplex,
              allowColor: this.allowColor,
              allow2on1: this.allow2on1,
              allowOrientation: this.allowOrientation,
              allowCustomPages: this.allowCustomPages,
              allowCopies: this.allowCopies,
              maxCopies: this.maxCopies,
              allowPaperSize: this.allowPaperSize,
              shopName: this.shopName,
              enablePricing: this.enablePricing,
              priceBwPerPage: this.priceBwPerPage,
              priceColorPerPage: this.priceColorPerPage,
              priceDuplexDiscount: this.priceDuplexDiscount
            })
          })
          .then(() => {
            this.isSavingSettings = false;
            this.settingsSavedToast = true;
            setTimeout(() => { this.settingsSavedToast = false; }, 2500);
            this.fetchStatus(true);
          })
          .catch(() => {
            this.isSavingSettings = false;
          });
        },

        toggleQueuePause() {
          this.queuePaused = !this.queuePaused;
          this.saveSettings();
        },

        openEditModal(job) {
          this.editForm = {
            id: job.id,
            code: job.code,
            customerName: job.customer_name || '',
            copies: job.copies || 1,
            paperSize: job.paper_size || 'A4',
            colorMode: job.color_mode || 'monochrome',
            duplexMode: job.duplex_mode || 'simplex',
            pagesPerSheet: job.pages_per_sheet || 1,
            orientation: job.orientation || 'auto',
            fitMode: job.fit_mode || 'fit'
          };
          this.editModalOpen = true;
        },

        saveJobEdit() {
          fetch(`/api/admin/jobs/${this.editForm.id}/edit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(this.editForm)
          })
          .then(r => r.json())
          .then(data => {
            if (data.success) {
              this.editModalOpen = false;
              this.fetchStatus();
            } else {
              alert(data.error || 'Failed to update job settings.');
            }
          })
          .catch(() => alert('Network error while saving changes.'));
        },

        openPinModal() {
          this.pinChangeCurrent = '';
          this.pinChangeNew = '';
          this.pinChangeError = '';
          this.pinChangeSuccess = '';
          this.pinModalOpen = true;
        },

        submitPinChange() {
          this.pinChangeError = '';
          this.pinChangeSuccess = '';
          fetch('/api/admin/change-pin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              currentPin: this.pinChangeCurrent,
              newPin: this.pinChangeNew
            })
          })
          .then(r => r.json())
          .then(data => {
            if (data.success) {
              this.pinChangeSuccess = 'Master PIN updated successfully.';
              setTimeout(() => { this.pinModalOpen = false; }, 1500);
            } else {
              this.pinChangeError = data.error || 'Failed to change PIN.';
            }
          })
          .catch(() => {
            this.pinChangeError = 'Network error while updating PIN.';
          });
        },

        jobAction(jobId, action) {
          audioStation.ensureUnlocked();
          fetch(`/api/admin/jobs/${jobId}/action`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action })
          })
          .then(r => r.json())
          .then(data => {
            if (data.success) {
              this.fetchStatus();
            } else {
              alert(data.error || 'Action failed.');
            }
          });
        },

        clearAllJobs() {
          if (!confirm('Are you sure you want to delete ALL print orders and clear files from the system? (This also clears the Windows print spooler so no old jobs print)')) {
            return;
          }
          fetch('/api/admin/clear-all', {
            method: 'POST'
          })
          .then(r => r.json())
          .then(data => {
            if (data.success) {
              this.fetchStatus();
            } else {
              alert(data.error || 'Failed to clear jobs.');
            }
          })
          .catch(() => alert('Network error while clearing jobs.'));
        },

        purgeWindowsSpooler() {
          if (!confirm('Flush Windows Print Spooler? This cancels all stuck, pending, or error prints currently inside Windows printer queues so no surprise prints occur.')) return;
          this.purgingSpooler = true;
          fetch('/api/admin/spooler/clear', { method: 'POST' })
            .then(r => r.json())
            .then(d => {
              this.purgingSpooler = false;
              alert(d.message || 'Windows Print Spooler cleared.');
              this.fetchStatus();
            })
            .catch(() => {
              this.purgingSpooler = false;
              alert('Error clearing spooler.');
            });
        },

        startAdminSSE() {
          if (this.eventSource) this.eventSource.close();
          this.eventSource = new EventSource('/api/admin/sse');

          const refresh = () => this.fetchStatus();

          this.eventSource.addEventListener('job_incoming', () => {
            if (this.soundEnabled) audioStation.playChime();
            refresh();
          });

          this.eventSource.addEventListener('job_needs_approval', () => {
            if (this.soundEnabled) audioStation.playChime();
            refresh();
          });

          this.eventSource.addEventListener('job_updated', refresh);
          this.eventSource.addEventListener('job_update', refresh);
          this.eventSource.addEventListener('settings_updated', refresh);
          this.eventSource.addEventListener('settings_update', refresh);

          this.eventSource.addEventListener('printer_alert', (e) => {
            try {
              const data = JSON.parse(e.data);
              this.printerAlert = data.message;
            } catch (err) {}
          });

          // Heartbeat polling every 2.5 seconds to guarantee instant synchronization
          if (!this.pollInterval) {
            this.pollInterval = setInterval(() => {
              if (this.isAuthenticated) {
                this.fetchStatus();
              }
            }, 2500);
          }
        },


        async loadTunnelInfo() {
          this.tunnelLoading = true;
          try {
            const res = await fetch('/api/admin/tunnel');
            if (res.ok) {
              const d = await res.json();
              this.tunnelStatus    = d.connected ? 'connected' : 'disconnected';
              this.tunnelHasToken  = d.hasToken;
              this.tunnelPublicUrl = d.publicUrl || '';
              this.tunnelId        = d.tunnelId  || '';
              // Don't pre-fill token field (security) — show masked placeholder if set
              if (d.hasToken && !this.tunnelToken) {
                this.tunnelToken = '';
              }
            }
          } catch(e) { /* ignore */ }
          this.tunnelLoading = false;
        },

        async saveTunnelToken() {
          this.tunnelSaving  = true;
          this.tunnelSaveMsg = '';
          this.tunnelSaveError = false;
          try {
            const res = await fetch('/api/admin/tunnel/save', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                token:     this.tunnelToken.trim(),
                publicUrl: this.tunnelPublicUrl.trim()
              })
            });
            const d = await res.json();
            if (res.ok) {
              this.tunnelSaveMsg  = 'Token saved! Tunnel restarting — wait 5–10 seconds then click Refresh.';
              this.tunnelHasToken = true;
              this.tunnelToken    = '';
              // Also update global publicUrl
              if (this.tunnelPublicUrl) this.publicUrl = this.tunnelPublicUrl;
              setTimeout(() => this.loadTunnelInfo(), 6000);
            } else {
              this.tunnelSaveMsg  = d.error || 'Save failed.';
              this.tunnelSaveError = true;
            }
          } catch(e) {
            this.tunnelSaveMsg  = 'Network error: ' + e.message;
            this.tunnelSaveError = true;
          }
          this.tunnelSaving = false;
        },

        async clearTunnelToken() {
          if (!confirm('Remove the tunnel token? Customers will lose remote access until a new token is added.')) return;
          try {
            await fetch('/api/admin/tunnel/clear', { method: 'POST' });
            this.tunnelHasToken  = false;
            this.tunnelToken     = '';
            this.tunnelStatus    = 'disconnected';
            this.tunnelSaveMsg   = 'Token removed. Tunnel stopped.';
            this.tunnelSaveError = false;
          } catch(e) {}
        },

        async testTunnelUrl() {
          if (!this.tunnelPublicUrl) return;
          this.tunnelTesting    = true;
          this.tunnelTestResult = '';
          this.tunnelTestOk     = false;
          try {
            const res = await fetch('/api/admin/tunnel/test', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ url: this.tunnelPublicUrl })
            });
            const d = await res.json();
            if (d.ok) {
              this.tunnelTestOk     = true;
              this.tunnelTestResult = '✓ Public URL is reachable! HTTP ' + d.statusCode + ' — customers can access the print page.';
              this.tunnelStatus = 'connected';
            } else {
              this.tunnelTestOk     = false;
              this.tunnelTestResult = '✗ Could not reach URL. Error: ' + (d.error || 'HTTP ' + d.statusCode);
            }
          } catch(e) {
            this.tunnelTestOk     = false;
            this.tunnelTestResult = '✗ Test failed: ' + e.message;
          }
          this.tunnelTesting = false;
        },

        getStatusBadgeClass(status) {
          switch (status) {
            case 'DONE': return 'badge-success';
            case 'PRINTING': return 'badge-info';
            case 'QUEUED': return 'badge-neutral';
            case 'PENDING_APPROVAL': return 'badge-warning';
            case 'FAILED':
            case 'CHECK_REPRINT':
            case 'REJECTED':
            case 'CANCELLED':
              return 'badge-danger';
            default:
              return 'badge-neutral';
          }
        }
      };
    }
  </script>
</body>
</html>
